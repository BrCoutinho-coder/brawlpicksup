<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brawl Draft Pro - 100% Auto</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #121826; color: #e2e8f0; overflow-x: hidden; }
    .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    #sidebar { transition: transform 0.3s ease-in-out; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1e293b; border-radius: 4px; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center pb-8">

  <!-- Aba Lateral de Favoritos -->
  <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden" onclick="toggleSidebar()"></div>
  <div id="sidebar" class="fixed top-0 right-0 h-full w-72 bg-slate-900 border-l border-slate-700 z-50 transform translate-x-full p-4 overflow-hidden flex flex-col">
    <div class="flex justify-between items-center mb-4 shrink-0">
      <h2 class="font-bold text-yellow-400">Meus Brawlers</h2>
      <button onclick="toggleSidebar()" class="text-gray-400 hover:text-white text-xl">&times;</button>
    </div>
    <input type="text" id="fav-search" placeholder="Buscar..." class="w-full bg-slate-800 text-white p-2 rounded-lg border border-slate-600 focus:outline-none mb-3 text-sm shrink-0" oninput="renderFavoritesList(this.value)">
    <div id="favorites-list" class="grid grid-cols-4 gap-2 overflow-y-auto pb-4"></div>
  </div>

  <div class="w-full max-w-md p-4">
    <header class="flex justify-between items-center mb-4">
      <h1 class="text-xl font-bold text-yellow-400">Brawl Draft</h1>
      <div class="flex items-center gap-2">
        <div id="api-status" class="text-[10px] font-bold px-2 py-1 rounded-full bg-yellow-600 text-white animate-pulse">🟡 Conectando...</div>
        <button onclick="toggleSidebar()" class="bg-slate-800 p-2 rounded text-xl border border-slate-600 hover:bg-slate-700">⭐</button>
      </div>
    </header>

    <div class="flex bg-slate-800 rounded-lg p-1 mb-4 border border-slate-700">
      <button id="mode-casual" onclick="setMode('casual')" class="flex-1 py-1 text-sm font-bold rounded-md transition text-gray-400">Casual</button>
      <button id="mode-ranked" onclick="setMode('ranked')" class="flex-1 py-1 text-sm font-bold rounded-md bg-yellow-500 text-slate-900 transition shadow">Ranqueada</button>
    </div>

    <main class="space-y-4">
      <!-- 1. Mapa -->
      <div class="glass p-4 rounded-xl">
        <label class="block text-sm font-bold mb-2 text-gray-300">1. Rotação Atual</label>
        <select id="map-select" class="w-full bg-slate-800 text-white p-2 rounded-lg border border-slate-600 focus:outline-none mb-1 text-sm" onchange="fetchMapStats()">
          <option value="">Carregando mapas...</option>
        </select>
        
        <div id="map-preview" class="hidden mt-3 rounded-lg border border-slate-600 overflow-hidden relative bg-slate-900">
          <!-- Oculta a imagem automaticamente se a URL fornecida pela API estiver quebrada -->
          <img id="map-img" src="" class="w-full h-24 object-cover opacity-80" alt="Mapa" onerror="this.style.display='none'">
        </div>
        <div id="map-loading" class="text-[10px] text-blue-400 hidden mt-1">Calculando Win Rates Globais...</div>
      </div>

      <!-- Área de Draft -->
      <div id="draft-area" class="space-y-4">
        <div class="glass p-4 rounded-xl">
          <label class="block text-sm font-bold mb-2 text-gray-300">2. Qual o seu turno?</label>
          <div class="flex gap-2">
            <button onclick="setTurn('first')" id="btn-first" class="flex-1 bg-blue-600 p-1.5 rounded text-sm font-bold opacity-50 transition">1º Pick</button>
            <button onclick="setTurn('mid')" id="btn-mid" class="flex-1 bg-purple-600 p-1.5 rounded text-sm font-bold opacity-50 transition">Meio (2º ao 5º)</button>
            <button onclick="setTurn('last')" id="btn-last" class="flex-1 bg-red-600 p-1.5 rounded text-sm font-bold opacity-50 transition">Último</button>
          </div>
        </div>

        <!-- 3. Picks Inimigos -->
        <div class="glass p-4 rounded-xl" id="enemy-section" style="opacity: 0.5; pointer-events: none;">
          <label class="block text-sm font-bold mb-2 text-gray-300">3. Picks da Equipe Inimiga</label>
          <div id="selected-enemies-container" class="flex flex-wrap gap-2 mb-3"></div>
          <div id="enemy-picker">
            <input type="text" id="enemy-search" placeholder="Buscar brawler inimigo..." class="w-full bg-slate-800 text-white p-2 rounded-lg border border-slate-600 focus:outline-none mb-2 text-sm" oninput="renderEnemyGrid(this.value)">
            <div id="enemy-grid" class="grid grid-cols-5 gap-1.5 max-h-40 overflow-y-auto p-1"></div>
          </div>
        </div>
      </div>

      <div class="mt-4">
        <h2 class="text-lg font-bold mb-2 text-green-400 border-b border-green-800 pb-1">Melhores Sugestões:</h2>
        <div id="results" class="space-y-2"></div>
      </div>
    </main>
  </div>

  <script>
    let state = {
      mode: 'ranked', mapId: null, turn: null, enemyPicks: [], mapTopBrawlers: [],
      currentWinRates: {}, allBrawlers: [], allMapsList: [],
      favorites: JSON.parse(localStorage.getItem('brawlFavorites')) || []
    };

    // Gera um avatar provisório se a imagem do servidor falhar
    function getFallbackAvatar(name) {
      return `https://ui-avatars.com/api/?name=${name}&background=1e293b&color=e2e8f0&size=128`;
    }

    async function initAPI() {
      try {
        const brawlersRes = await fetch('https://api.brawlapi.com/v1/brawlers');
        const brawlersData = await brawlersRes.json();
        
        // Pega a URL oficial
        state.allBrawlers = brawlersData.list.map(b => ({
          name: b.name, 
          image: b.imageUrl2 || b.imageUrl
        })).sort((a, b) => a.name.localeCompare(b.name));

        renderEnemyGrid();
        renderFavoritesList();

        const [eventsRes, mapsRes] = await Promise.all([
          fetch('https://api.brawlapi.com/v1/events').catch(() => ({ json: () => ({ active: [] }) })),
          fetch('https://api.brawlapi.com/v1/maps').catch(() => ({ json: () => ({ list: [] }) }))
        ]);
        
        const eventsData = await eventsRes.json();
        const mapsData = await mapsRes.json();

        state.allMapsList = mapsData.list || [];
        const activeMapIds = eventsData.active ? eventsData.active.filter(ev => ev.map && ev.map.id).map(ev => ev.map.id) : [];

        const mapSelect = document.getElementById('map-select');
        mapSelect.innerHTML = '<option value="">Selecione o mapa...</option>';

        const activeMaps = state.allMapsList.filter(m => activeMapIds.includes(m.id));
        if(activeMaps.length > 0) {
          mapSelect.innerHTML += `<optgroup label="🟢 Active Now">`;
          activeMaps.forEach(m => mapSelect.innerHTML += `<option value="${m.id}">[${m.gameMode.name}] ${m.name}</option>`);
          mapSelect.innerHTML += `</optgroup>`;
        }

        const otherMaps = state.allMapsList.filter(m => !activeMapIds.includes(m.id));
        mapSelect.innerHTML += `<optgroup label="⚪ All Maps">`;
        otherMaps.forEach(m => mapSelect.innerHTML += `<option value="${m.id}">[${m.gameMode.name}] ${m.name}</option>`);
        mapSelect.innerHTML += `</optgroup>`;

        document.getElementById('api-status').innerText = '🟢 Ao Vivo';
        document.getElementById('api-status').classList.replace('bg-yellow-600', 'bg-green-600');
      } catch (e) {
        document.getElementById('api-status').innerText = '🔴 Erro API';
        document.getElementById('api-status').classList.replace('bg-yellow-600', 'bg-red-600');
      }
    }

    async function fetchMapStats() {
      state.mapId = document.getElementById('map-select').value;
      const previewBox = document.getElementById('map-preview');
      const imgEl = document.getElementById('map-img');

      if (!state.mapId) { previewBox.classList.add('hidden'); return; }

      const selectedMap = state.allMapsList.find(m => m.id == state.mapId);
      if (selectedMap && selectedMap.environment.imageUrl) {
        imgEl.style.display = 'block';
        imgEl.src = selectedMap.environment.imageUrl;
        previewBox.classList.remove('hidden');
      } else {
        previewBox.classList.add('hidden');
      }
      
      document.getElementById('map-loading').style.display = 'block';
      const res = await fetch(`https://api.brawlapi.com/v1/maps/${state.mapId}`);
      const data = await res.json();
      
      state.currentWinRates = {};
      data.stats.forEach(s => { state.currentWinRates[s.brawler.name] = s.winRate; });
      state.mapTopBrawlers = data.stats.sort((a, b) => b.winRate - a.winRate);
      
      document.getElementById('map-loading').style.display = 'none';
      renderEnemyGrid(document.getElementById('enemy-search').value || '');
      renderFavoritesList(document.getElementById('fav-search').value || '');
      updateRecommendations();
    }

    function setMode(mode) {
      state.mode = mode;
      document.getElementById('mode-casual').className = mode === 'casual' ? 'flex-1 py-1 text-sm font-bold rounded-md bg-yellow-500 text-slate-900 transition shadow' : 'flex-1 py-1 text-sm font-bold rounded-md transition text-gray-400';
      document.getElementById('mode-ranked').className = mode === 'ranked' ? 'flex-1 py-1 text-sm font-bold rounded-md bg-yellow-500 text-slate-900 transition shadow' : 'flex-1 py-1 text-sm font-bold rounded-md transition text-gray-400';
      document.getElementById('draft-area').style.display = mode === 'casual' ? 'none' : 'block';
      updateRecommendations();
    }

    function setTurn(turn) {
      state.turn = turn;
      ['first', 'mid', 'last'].forEach(t => document.getElementById(`btn-${t}`).style.opacity = '0.5');
      document.getElementById(`btn-${turn}`).style.opacity = '1';
      
      const eSec = document.getElementById('enemy-section');
      if (turn === 'first') {
        eSec.style.opacity = '0.5'; eSec.style.pointerEvents = 'none';
        state.enemyPicks = [];
        renderSelectedEnemies();
      } else {
        eSec.style.opacity = '1'; eSec.style.pointerEvents = 'auto';
      }
      updateRecommendations();
    }

    // Retorna a tag de % estilizada e super discreta
    function getSubtleWrTag(brawlerName) {
      const wr = state.currentWinRates[brawlerName];
      if (!wr) return '';
      return `<div class="absolute top-0.5 right-0.5 bg-slate-900/70 text-gray-300 text-[8px] px-1 rounded backdrop-blur-sm border border-slate-700/50 pointer-events-none">${wr}%</div>`;
    }

    function renderEnemyGrid(filter = '') {
      const grid = document.getElementById('enemy-grid');
      grid.innerHTML = '';
      
      let filtered = state.allBrawlers.filter(b => b.name.toLowerCase().includes(filter.toLowerCase()) && !state.enemyPicks.includes(b.name));
      filtered.sort((a, b) => {
        const wrA = state.currentWinRates[a.name] || 0, wrB = state.currentWinRates[b.name] || 0;
        return wrB !== wrA ? wrB - wrA : a.name.localeCompare(b.name);
      });
      
      filtered.forEach(b => {
        grid.innerHTML += `
          <div onclick="addEnemy('${b.name}', '${b.image}')" class="relative cursor-pointer hover:scale-105 transition rounded overflow-hidden">
            <img src="${b.image}" onerror="this.src='${getFallbackAvatar(b.name)}'" class="w-full aspect-square object-cover bg-slate-900 border border-slate-600 hover:border-yellow-400" alt="${b.name}">
            ${getSubtleWrTag(b.name)}
          </div>
        `;
      });
    }

    function addEnemy(name, image) {
      if (state.enemyPicks.length >= 5) return;
      state.enemyPicks.push(name);
      document.getElementById('enemy-search').value = '';
      renderSelectedEnemies(); renderEnemyGrid(); updateRecommendations();
    }

    function removeEnemy(name) {
      state.enemyPicks = state.enemyPicks.filter(e => e !== name);
      renderSelectedEnemies(); renderEnemyGrid(); updateRecommendations();
    }

    function renderSelectedEnemies() {
      const container = document.getElementById('selected-enemies-container');
      container.innerHTML = '';
      state.enemyPicks.forEach(name => {
        const bInfo = state.allBrawlers.find(b => b.name === name);
        if (bInfo) {
          container.innerHTML += `
            <div class="flex items-center gap-1 bg-red-950/60 p-1 pr-2 rounded border border-red-900">
              <img src="${bInfo.image}" onerror="this.src='${getFallbackAvatar(name)}'" class="w-6 h-6 rounded bg-slate-900">
              <span class="text-xs font-bold text-white">${name}</span>
              <button onclick="removeEnemy('${name}')" class="ml-1 text-red-500 hover:text-red-300 font-bold ml-2">X</button>
            </div>
          `;
        }
      });
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('translate-x-full');
      document.getElementById('sidebar-overlay').classList.toggle('hidden');
    }

    function renderFavoritesList(filter = '') {
      const list = document.getElementById('favorites-list');
      list.innerHTML = '';
      let filtered = state.allBrawlers.filter(b => b.name.toLowerCase().includes(filter.toLowerCase()));
      
      filtered.sort((a, b) => {
        const aFav = state.favorites.includes(a.name), bFav = state.favorites.includes(b.name);
        if (aFav && !bFav) return -1;
        if (!aFav && bFav) return 1;
        const wrA = state.currentWinRates[a.name] || 0, wrB = state.currentWinRates[b.name] || 0;
        return wrB !== wrA ? wrB - wrA : a.name.localeCompare(b.name);
      });

      filtered.forEach(b => {
        const isFav = state.favorites.includes(b.name);
        const style = isFav ? 'border-2 border-yellow-400 opacity-100' : 'border border-slate-700 opacity-50 hover:opacity-100';
        
        list.innerHTML += `
          <div onclick="toggleFav('${b.name}')" class="cursor-pointer flex flex-col items-center gap-1 relative">
            <img src="${b.image}" onerror="this.src='${getFallbackAvatar(b.name)}'" class="w-full aspect-square object-cover rounded-lg bg-slate-800 ${style}">
            <span class="text-[9px] truncate w-full text-center ${isFav ? 'text-yellow-400 font-bold' : 'text-gray-400'}">${b.name}</span>
            ${getSubtleWrTag(b.name)}
          </div>
        `;
      });
    }

    function toggleFav(brawlerName) {
      if (state.favorites.includes(brawlerName)) {
        state.favorites = state.favorites.filter(f => f !== brawlerName);
      } else { state.favorites.push(brawlerName); }
      localStorage.setItem('brawlFavorites', JSON.stringify(state.favorites));
      renderFavoritesList(document.getElementById('fav-search').value);
      updateRecommendations();
    }

    function updateRecommendations() {
      const resDiv = document.getElementById('results');
      resDiv.innerHTML = '';

      if (!state.mapId) { resDiv.innerHTML = '<p class="text-xs text-gray-400">Selecione o mapa acima.</p>'; return; }
      if (state.mode === 'ranked' && !state.turn) { resDiv.innerHTML = '<p class="text-xs text-gray-400">Selecione o seu turno (1º, Meio ou Último).</p>'; return; }

      // 100% Data-Driven: Pega a lista crua de Win Rates e remove os já selecionados
      let candidatos = state.mapTopBrawlers.map(apiB => {
        let bInfo = state.allBrawlers.find(b => b.name === apiB.brawler.name);
        return { 
          name: apiB.brawler.name, image: bInfo ? bInfo.image : '',
          winRate: apiB.winRate, isFav: state.favorites.includes(apiB.brawler.name)
        };
      });

      if (state.mode === 'ranked' && state.enemyPicks.length > 0) {
        candidatos = candidatos.filter(b => !state.enemyPicks.includes(b.name));
      }

      // Ordena por Favorito, depois por Win Rate
      candidatos.sort((a, b) => (b.isFav === a.isFav) ? (b.winRate - a.winRate) : (b.isFav ? 1 : -1));
      
      const best = candidatos.slice(0, 5);
      
      if(best.length === 0) { 
        resDiv.innerHTML = '<p class="text-xs text-yellow-400">Nenhum dado retornado para este mapa.</p>'; 
        return; 
      }

      best.forEach(b => {
        const starHtml = b.isFav ? `<div class="absolute -top-2 -left-2 text-xl drop-shadow-md z-20">⭐</div>` : '';
        
        resDiv.innerHTML += `
          <div class="glass p-2 rounded-lg border-l-4 ${b.isFav ? 'border-yellow-400 bg-yellow-900/10' : 'border-green-500'} flex flex-col relative">
            ${starHtml}
            <div class="flex items-center gap-3">
              <img src="${b.image}" onerror="this.src='${getFallbackAvatar(b.name)}'" class="w-10 h-10 rounded border border-slate-600 bg-slate-900 shadow-lg">
              <div class="flex-1">
                <div class="flex justify-between items-center">
                  <span class="font-bold text-base text-white">${b.name}</span>
                  <span class="text-[10px] bg-green-900/80 text-green-200 px-1.5 py-0.5 rounded border border-green-700/50">Taxa de Vitória: ${b.winRate}%</span>
                </div>
              </div>
            </div>
          </div>
        `;
      });
    }

    initAPI();
  </script>
</body>
</html>
