<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brawl Draft Pro - Ao Vivo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #121826; color: #e2e8f0; }
    .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
  </style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center">

  <!-- Header & API Status -->
  <header class="w-full max-w-md flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold text-yellow-400">Brawl Draft</h1>
    <div id="api-status" class="text-xs font-bold px-3 py-1 rounded-full bg-yellow-600 text-white animate-pulse">
      🟡 Conectando BrawlAPI...
    </div>
  </header>

  <main class="w-full max-w-md space-y-4">
    
    <!-- 1. Mapa ao Vivo -->
    <div class="glass p-4 rounded-xl">
      <label class="block text-sm font-bold mb-2 text-gray-300">1. Rotação Atual (Ao Vivo)</label>
      <select id="map-select" class="w-full bg-slate-800 text-white p-3 rounded-lg border border-slate-600 focus:outline-none focus:border-yellow-400 font-semibold mb-2" onchange="fetchMapStats()">
        <option value="">Carregando mapas...</option>
      </select>
      <div id="map-loading" class="text-xs text-blue-400 hidden mt-1">Carregando estatísticas do mapa selecionado...</div>
    </div>

    <!-- 2. Seu Turno -->
    <div class="glass p-4 rounded-xl">
      <label class="block text-sm font-bold mb-2 text-gray-300">2. Qual o seu pick?</label>
      <div class="flex gap-2">
        <button onclick="setTurn('first')" id="btn-first" class="flex-1 bg-blue-600 p-2 rounded-lg font-bold opacity-50 hover:opacity-100 transition">1º Pick</button>
        <button onclick="setTurn('mid')" id="btn-mid" class="flex-1 bg-purple-600 p-2 rounded-lg font-bold opacity-50 hover:opacity-100 transition">2º/3º Pick</button>
        <button onclick="setTurn('last')" id="btn-last" class="flex-1 bg-red-600 p-2 rounded-lg font-bold opacity-50 hover:opacity-100 transition">Last Pick</button>
      </div>
    </div>

    <!-- 3. Pick Inimigo (Ativo apenas se não for First Pick) -->
    <div class="glass p-4 rounded-xl" id="enemy-section" style="opacity: 0.5; pointer-events: none;">
      <label class="block text-sm font-bold mb-2 text-gray-300">3. O que o inimigo pegou?</label>
      <select id="enemy-select" class="w-full bg-slate-800 text-white p-3 rounded-lg border border-slate-600" onchange="updateRecommendations()">
        <option value="">Selecione o brawler inimigo...</option>
        <!-- Preenchido via JS -->
      </select>
    </div>

    <!-- Resultados -->
    <div class="mt-6">
      <h2 class="text-xl font-bold mb-3 text-green-400 border-b border-green-800 pb-2">Melhores Escolhas:</h2>
      <div id="results" class="space-y-3">
        <p class="text-gray-400 text-sm text-center mt-4">Preencha os dados acima para ver as sugestões.</p>
      </div>
    </div>

  </main>

  <script>
    // --- ESTADO DO DRAFT ---
    let state = {
      mapId: null,
      turn: null, // 'first', 'mid', 'last'
      enemyPick: null,
      mapTopBrawlers: [] // Dados reais da API para o mapa escolhido
    };

    // --- BASE DE DADOS COMPACTA (Regras e 5 Counters Reais) ---
    // Mesmo no first pick, você precisa saber de quem esses brawlers apanham.
    const brawlerKnowledge = {
      "Belle": { role: "safe", counters: ["Piper", "Nani", "Mortis", "Edgar", "Mico"] },
      "Piper": { role: "safe", counters: ["Nani", "Mortis", "Mico", "Meg", "Leon"] },
      "Buster": { role: "safe", counters: ["Colette", "Gale", "Chester", "Lou", "Charlie"] },
      "Meg": { role: "safe", counters: ["Colette", "Chester", "Gale", "Amber", "Clancy"] },
      "Gene": { role: "safe", counters: ["Buster", "Fang", "Tara", "Sandy", "Max"] },
      "Mortis": { role: "punish", counters: ["Shelly", "Bull", "Gale", "Surge", "Jacky"] },
      "Edgar": { role: "punish", counters: ["Gale", "Surge", "Shelly", "Piper (com Gadget)", "Charlie"] },
      "Dynamike": { role: "punish", counters: ["Mortis", "Mico", "Edgar", "Leon", "Max"] },
      "Tick": { role: "punish", counters: ["Mortis", "Edgar", "Mico", "Lily", "Leon"] },
      "Colette": { role: "mid", counters: ["Piper", "Nani", "Belle", "Spike", "Crow"] },
      "Gale": { role: "mid", counters: ["Piper", "Belle", "Nani", "Mandy", "Grom"] }
    };

    // --- 1. BUSCAR DADOS AO VIVO (BrawlAPI) ---
    async function initAPI() {
      try {
        const res = await fetch('https://api.brawlapi.com/v1/events');
        const data = await res.json();
        
        const select = document.getElementById('map-select');
        select.innerHTML = '<option value="">Selecione o mapa atual...</option>';
        
        // Pega apenas eventos ativos
        data.active.forEach(event => {
          const opt = document.createElement('option');
          opt.value = event.map.id;
          opt.text = `[${event.map.gameMode.name}] ${event.map.name}`;
          select.appendChild(opt);
        });

        // Preenche o select de inimigos de forma genérica para exemplo
        const enemySelect = document.getElementById('enemy-select');
        Object.keys(brawlerKnowledge).sort().forEach(b => {
          enemySelect.innerHTML += `<option value="${b}">${b}</option>`;
        });

        const status = document.getElementById('api-status');
        status.innerText = '🟢 Ao Vivo (BrawlAPI)';
        status.classList.replace('bg-yellow-600', 'bg-green-600');
        status.classList.remove('animate-pulse');

      } catch (error) {
        document.getElementById('api-status').innerText = '🔴 Erro na API';
        document.getElementById('api-status').classList.replace('bg-yellow-600', 'bg-red-600');
      }
    }

    // --- 2. BUSCAR ESTATÍSTICAS DO MAPA SELECIONADO ---
    async function fetchMapStats() {
      const select = document.getElementById('map-select');
      state.mapId = select.value;
      if (!state.mapId) return;

      const loader = document.getElementById('map-loading');
      loader.style.display = 'block';

      try {
        const res = await fetch(`https://api.brawlapi.com/v1/maps/${state.mapId}`);
        const data = await res.json();
        // Salva os top 15 brawlers com maior Win Rate neste mapa agora
        state.mapTopBrawlers = data.stats.sort((a, b) => b.winRate - a.winRate).slice(0, 15);
      } catch (e) {
        console.error("Erro ao puxar status do mapa", e);
      }
      
      loader.style.display = 'none';
      updateRecommendations();
    }

    // --- 3. CONTROLE DE INTERFACE ---
    function setTurn(turn) {
      state.turn = turn;
      document.getElementById('btn-first').style.opacity = turn === 'first' ? '1' : '0.5';
      document.getElementById('btn-mid').style.opacity = turn === 'mid' ? '1' : '0.5';
      document.getElementById('btn-last').style.opacity = turn === 'last' ? '1' : '0.5';

      const enemySec = document.getElementById('enemy-section');
      if (turn === 'first') {
        enemySec.style.opacity = '0.5';
        enemySec.style.pointerEvents = 'none';
        state.enemyPick = null;
        document.getElementById('enemy-select').value = "";
      } else {
        enemySec.style.opacity = '1';
        enemySec.style.pointerEvents = 'auto';
      }
      updateRecommendations();
    }

    // --- 4. MOTOR DE RECOMENDAÇÃO ---
    function updateRecommendations() {
      state.enemyPick = document.getElementById('enemy-select').value;
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = '';

      if (!state.mapId || !state.turn) {
        resultsDiv.innerHTML = '<p class="text-gray-400 text-sm text-center">Selecione o mapa e seu turno.</p>';
        return;
      }

      // Base de candidatos: Cruzamento dos dados ao vivo (API) com nossa base de conhecimento local
      let candidatos = state.mapTopBrawlers.map(apiBrawler => {
        let know = brawlerKnowledge[apiBrawler.brawler.name] || { 
          role: "mid", 
          counters: ["(Depende do comp)", "Assassinos", "Snipers", "Tanks", "Throwers"] // Genérico se não estiver mapeado hardcoded
        };
        return { name: apiBrawler.brawler.name, winRate: apiBrawler.winRate, ...know };
      });

      // Aplica Filtros de Turno
      if (state.turn === 'first') {
        // First pick: Só pega brawlers seguros (safe), ignora punições fáceis
        candidatos = candidatos.filter(b => b.role === 'safe');
      } else if (state.turn === 'mid' || state.turn === 'last') {
        if (state.enemyPick) {
          // Se o inimigo escolheu algo, tenta achar quem ganha dele
          // (Para simplificar no front, vamos apenas ordenar para evitar o counter do inimigo)
          candidatos = candidatos.filter(b => {
             // O meu brawler candidato NÃO pode ter o inimigo na lista de fraquezas dele
             return !b.counters.includes(state.enemyPick);
          });
        }
        if (state.turn === 'last') {
          // Last pick permite usar assassinos/throwers puros
          candidatos = candidatos.sort((a,b) => (a.role === 'punish' ? -1 : 1));
        }
      }

      // Pega os 3 melhores
      const best = candidatos.slice(0, 3);

      if (best.length === 0) {
        resultsDiv.innerHTML = '<p class="text-yellow-400 text-sm">Nenhuma recomendação perfeita encontrada. Pegue um brawler de conforto.</p>';
        return;
      }

      // Renderiza as sugestões revelando os 5 counters de cada um
      best.forEach(b => {
        const countersHtml = b.counters.slice(0,5).map(c => 
          `<span class="inline-block bg-red-900 text-red-100 text-[10px] px-2 py-1 rounded-md mr-1 mb-1 border border-red-700">${c}</span>`
        ).join('');

        resultsDiv.innerHTML += `
          <div class="glass p-3 rounded-lg border-l-4 border-green-500">
            <div class="flex justify-between items-center mb-2">
              <span class="font-bold text-lg text-white">${b.name}</span>
              <span class="text-xs bg-green-900 text-green-300 px-2 py-1 rounded border border-green-700">Win Rate: ${b.winRate}%</span>
            </div>
            <div class="bg-red-950/50 p-2 rounded-md">
              <p class="text-xs text-red-400 font-bold mb-1">⚠️ Sofre para (Evite se eles tiverem):</p>
              <div class="flex flex-wrap">${countersHtml}</div>
            </div>
          </div>
        `;
      });
    }

    // Start
    initAPI();
  </script>
</body>
</html>
