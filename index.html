<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brawl Draft Pro - Ao Vivo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #121826; color: #e2e8f0; overflow-x: hidden; }
    .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    /* Aba lateral */
    #sidebar { transition: transform 0.3s ease-in-out; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center">

  <!-- Aba Lateral de Favoritos -->
  <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden" onclick="toggleSidebar()"></div>
  <div id="sidebar" class="fixed top-0 right-0 h-full w-64 bg-slate-900 border-l border-slate-700 z-50 transform translate-x-full p-4 overflow-y-auto">
    <div class="flex justify-between items-center mb-4">
      <h2 class="font-bold text-yellow-400">Meus Brawlers</h2>
      <button onclick="toggleSidebar()" class="text-gray-400 hover:text-white text-xl">&times;</button>
    </div>
    <p class="text-xs text-gray-400 mb-4">Eles terão prioridade nas recomendações.</p>
    <div id="favorites-list" class="space-y-2 flex flex-col text-sm">
      <!-- Preenchido via JS -->
    </div>
  </div>

  <div class="w-full max-w-md p-4">
    <!-- Header -->
    <header class="flex justify-between items-center mb-4">
      <h1 class="text-xl font-bold text-yellow-400">Brawl Draft</h1>
      <div class="flex items-center gap-2">
        <div id="api-status" class="text-[10px] font-bold px-2 py-1 rounded-full bg-yellow-600 text-white animate-pulse">
          🟡 Conectando...
        </div>
        <button onclick="toggleSidebar()" class="bg-slate-800 p-2 rounded text-xl border border-slate-600 hover:bg-slate-700">⭐</button>
      </div>
    </header>

    <!-- Toggle Casual / Ranqueada -->
    <div class="flex bg-slate-800 rounded-lg p-1 mb-4 border border-slate-700">
      <button id="mode-casual" onclick="setMode('casual')" class="flex-1 py-1 text-sm font-bold rounded-md transition text-gray-400">Casual</button>
      <button id="mode-ranked" onclick="setMode('ranked')" class="flex-1 py-1 text-sm font-bold rounded-md bg-yellow-500 text-slate-900 transition shadow">Ranqueada</button>
    </div>

    <main class="space-y-4">
      <!-- 1. Mapa -->
      <div class="glass p-4 rounded-xl">
        <label class="block text-sm font-bold mb-2 text-gray-300">1. Rotação Atual</label>
        <select id="map-select" class="w-full bg-slate-800 text-white p-2 rounded-lg border border-slate-600 focus:outline-none mb-1 text-sm" onchange="fetchMapStats()">
          <option value="">Carregando mapas...</option>
        </select>
        <div id="map-loading" class="text-[10px] text-blue-400 hidden">Puxando Win Rates...</div>
      </div>

      <!-- Área de Draft (Esconde no Casual) -->
      <div id="draft-area" class="space-y-4">
        <div class="glass p-4 rounded-xl">
          <label class="block text-sm font-bold mb-2 text-gray-300">2. Seu turno</label>
          <div class="flex gap-2">
            <button onclick="setTurn('first')" id="btn-first" class="flex-1 bg-blue-600 p-1.5 rounded text-sm font-bold opacity-50">1º Pick</button>
            <button onclick="setTurn('mid')" id="btn-mid" class="flex-1 bg-purple-600 p-1.5 rounded text-sm font-bold opacity-50">2º/3º Pick</button>
            <button onclick="setTurn('last')" id="btn-last" class="flex-1 bg-red-600 p-1.5 rounded text-sm font-bold opacity-50">Last</button>
          </div>
        </div>

        <div class="glass p-4 rounded-xl" id="enemy-section" style="opacity: 0.5; pointer-events: none;">
          <label class="block text-sm font-bold mb-2 text-gray-300">3. Pick Inimigo</label>
          <select id="enemy-select" class="w-full bg-slate-800 text-white p-2 rounded-lg border border-slate-600 text-sm" onchange="updateRecommendations()">
            <option value="">Nenhum...</option>
          </select>
        </div>
      </div>

      <!-- Resultados -->
      <div class="mt-4">
        <h2 class="text-lg font-bold mb-2 text-green-400 border-b border-green-800 pb-1">Melhores Picks:</h2>
        <div id="results" class="space-y-2"></div>
      </div>
    </main>
  </div>

  <script>
    let state = {
      mode: 'ranked', // 'ranked' ou 'casual'
      mapId: null, turn: null, enemyPick: null, mapTopBrawlers: [],
      favorites: JSON.parse(localStorage.getItem('brawlFavorites')) || []
    };

    const brawlerKnowledge = {
      "Belle": { role: "safe", counters: ["Piper", "Nani", "Mortis", "Edgar", "Mico"] },
      "Piper": { role: "safe", counters: ["Nani", "Mortis", "Mico", "Meg", "Leon"] },
      "Buster": { role: "safe", counters: ["Colette", "Gale", "Chester", "Lou", "Charlie"] },
      "Meg": { role: "safe", counters: ["Colette", "Chester", "Gale", "Amber", "Clancy"] },
      "Gene": { role: "safe", counters: ["Buster", "Fang", "Tara", "Sandy", "Max"] },
      "Mortis": { role: "punish", counters: ["Shelly", "Bull", "Gale", "Surge", "Jacky"] },
      "Edgar": { role: "punish", counters: ["Gale", "Surge", "Shelly", "Piper", "Charlie"] },
      "Dynamike": { role: "punish", counters: ["Mortis", "Mico", "Edgar", "Leon", "Max"] },
      "Tick": { role: "punish", counters: ["Mortis", "Edgar", "Mico", "Lily", "Leon"] },
      "Colette": { role: "mid", counters: ["Piper", "Nani", "Belle", "Spike", "Crow"] },
      "Gale": { role: "mid", counters: ["Piper", "Belle", "Nani", "Mandy", "Grom"] }
    };

    // --- SETUP INICIAL ---
    async function initAPI() {
      try {
        const res = await fetch('https://api.brawlapi.com/v1/events');
        const data = await res.json();
        const select = document.getElementById('map-select');
        select.innerHTML = '<option value="">Selecione o mapa...</option>';
        data.active.forEach(ev => select.innerHTML += `<option value="${ev.map.id}">[${ev.map.gameMode.name}] ${ev.map.name}</option>`);

        const enemySelect = document.getElementById('enemy-select');
        Object.keys(brawlerKnowledge).sort().forEach(b => enemySelect.innerHTML += `<option value="${b}">${b}</option>`);

        document.getElementById('api-status').innerText = '🟢 Ao Vivo';
        document.getElementById('api-status').classList.replace('bg-yellow-600', 'bg-green-600');
        document.getElementById('api-status').classList.remove('animate-pulse');
        renderFavoritesList();
      } catch (e) {
        document.getElementById('api-status').innerText = '🔴 Erro API';
        document.getElementById('api-status').classList.replace('bg-yellow-600', 'bg-red-600');
      }
    }

    async function fetchMapStats() {
      state.mapId = document.getElementById('map-select').value;
      if (!state.mapId) return;
      document.getElementById('map-loading').style.display = 'block';
      const res = await fetch(`https://api.brawlapi.com/v1/maps/${state.mapId}`);
      const data = await res.json();
      state.mapTopBrawlers = data.stats.sort((a, b) => b.winRate - a.winRate).slice(0, 15);
      document.getElementById('map-loading').style.display = 'none';
      updateRecommendations();
    }

    // --- CONTROLE DE MODO E TURNO ---
    function setMode(mode) {
      state.mode = mode;
      document.getElementById('mode-casual').className = mode === 'casual' ? 'flex-1 py-1 text-sm font-bold rounded-md bg-yellow-500 text-slate-900 transition shadow' : 'flex-1 py-1 text-sm font-bold rounded-md transition text-gray-400';
      document.getElementById('mode-ranked').className = mode === 'ranked' ? 'flex-1 py-1 text-sm font-bold rounded-md bg-yellow-500 text-slate-900 transition shadow' : 'flex-1 py-1 text-sm font-bold rounded-md transition text-gray-400';
      
      document.getElementById('draft-area').style.display = mode === 'casual' ? 'none' : 'block';
      updateRecommendations();
    }

    function setTurn(turn) {
      state.turn = turn;
      ['first', 'mid', 'last'].forEach(t => document.getElementById(`btn-${t}`).style.opacity = '0.5');
      document.getElementById(`btn-${turn}`).style.opacity = '1';

      const eSec = document.getElementById('enemy-section');
      if (turn === 'first') {
        eSec.style.opacity = '0.5'; eSec.style.pointerEvents = 'none';
        state.enemyPick = null; document.getElementById('enemy-select').value = "";
      } else {
        eSec.style.opacity = '1'; eSec.style.pointerEvents = 'auto';
      }
      updateRecommendations();
    }

    // --- FAVORITOS (Sidebar) ---
    function toggleSidebar() {
      const sb = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      if (sb.classList.contains('translate-x-full')) {
        sb.classList.remove('translate-x-full');
        overlay.classList.remove('hidden');
      } else {
        sb.classList.add('translate-x-full');
        overlay.classList.add('hidden');
      }
    }

    function renderFavoritesList() {
      const list = document.getElementById('favorites-list');
      list.innerHTML = '';
      Object.keys(brawlerKnowledge).sort().forEach(b => {
        const isFav = state.favorites.includes(b);
        list.innerHTML += `
          <label class="flex items-center gap-2 p-1 hover:bg-slate-800 rounded cursor-pointer">
            <input type="checkbox" ${isFav ? 'checked' : ''} onchange="toggleFav('${b}')" class="w-4 h-4 accent-yellow-500">
            <span class="${isFav ? 'text-yellow-400 font-bold' : 'text-gray-300'}">${b}</span>
          </label>
        `;
      });
    }

    function toggleFav(brawler) {
      if (state.favorites.includes(brawler)) {
        state.favorites = state.favorites.filter(f => f !== brawler);
      } else {
        state.favorites.push(brawler);
      }
      localStorage.setItem('brawlFavorites', JSON.stringify(state.favorites));
      renderFavoritesList();
      updateRecommendations();
    }

    // --- LÓGICA FINAL ---
    function updateRecommendations() {
      state.enemyPick = document.getElementById('enemy-select').value;
      const resDiv = document.getElementById('results');
      resDiv.innerHTML = '';

      if (!state.mapId) { resDiv.innerHTML = '<p class="text-xs text-gray-400">Selecione o mapa.</p>'; return; }
      if (state.mode === 'ranked' && !state.turn) { resDiv.innerHTML = '<p class="text-xs text-gray-400">Selecione seu turno.</p>'; return; }

      let candidatos = state.mapTopBrawlers.map(apiB => {
        let know = brawlerKnowledge[apiB.brawler.name] || { role: "mid", counters: ["Tanks", "Snipers", "Assassinos", "Spawners", "Throwers"] };
        return { name: apiBrawler = apiB.brawler.name, winRate: apiB.winRate, isFav: state.favorites.includes(apiB.brawler.name), ...know };
      });

      if (state.mode === 'ranked') {
        if (state.turn === 'first') candidatos = candidatos.filter(b => b.role === 'safe');
        else if (state.enemyPick) candidatos = candidatos.filter(b => !b.counters.includes(state.enemyPick));
        if (state.turn === 'last') candidatos.sort((a,b) => (a.role === 'punish' ? -1 : 1));
      }

      // Prioridade mestre: Se é favorito, sobe. Senão, fica pela Win Rate.
      candidatos.sort((a, b) => (b.isFav === a.isFav) ? (b.winRate - a.winRate) : (b.isFav ? 1 : -1));

      const best = candidatos.slice(0, 4); // Mostra 4 no max
      if(best.length === 0) { resDiv.innerHTML = '<p class="text-xs text-yellow-400">Nenhum brawler 100% seguro mapeado. Vá com seu melhor.</p>'; return; }

      best.forEach(b => {
        const counters = b.counters.slice(0,5).map(c => `<span class="bg-red-900 text-[9px] px-1.5 py-0.5 rounded border border-red-700 mr-1 mb-1 whitespace-nowrap">${c}</span>`).join('');
        resDiv.innerHTML += `
          <div class="glass p-2.5 rounded-lg border-l-4 ${b.isFav ? 'border-yellow-400 bg-yellow-900/10' : 'border-green-500'}">
            <div class="flex justify-between items-center mb-1.5">
              <span class="font-bold text-base text-white">${b.isFav ? '⭐ ' : ''}${b.name}</span>
              <span class="text-[10px] bg-green-900 px-1.5 py-0.5 rounded border border-green-700">Win Rate: ${b.winRate}%</span>
            </div>
            <div class="bg-red-950/40 p-1.5 rounded">
              <p class="text-[10px] text-red-400 font-bold mb-1">⚠️ Sofre para:</p>
              <div class="flex flex-wrap">${counters}</div>
            </div>
          </div>
        `;
      });
    }

    initAPI();
  </script>
</body>
</html>
