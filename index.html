<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brawl Draft Pro - Tático & Debug</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #121826; color: #e2e8f0; overflow-x: hidden; }
    .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    #sidebar { transition: transform 0.3s ease-in-out; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1e293b; border-radius: 4px; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center pb-16 relative">

  <!-- Aba Lateral de Favoritos -->
  <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden" onclick="toggleSidebar()"></div>
  <div id="sidebar" class="fixed top-0 right-0 h-full w-72 bg-slate-900 border-l border-slate-700 z-50 transform translate-x-full p-4 overflow-hidden flex flex-col">
    <div class="flex justify-between items-center mb-4 shrink-0">
      <h2 class="font-bold text-yellow-400">Meus Brawlers</h2>
      <button onclick="toggleSidebar()" class="text-gray-400 hover:text-white text-xl">&times;</button>
    </div>
    <input type="text" id="fav-search" placeholder="Buscar..." class="w-full bg-slate-800 text-white p-2 rounded-lg border border-slate-600 focus:outline-none mb-3 text-sm shrink-0" oninput="renderFavoritesList(this.value)">
    <div id="favorites-list" class="grid grid-cols-4 gap-2 overflow-y-auto pb-4"></div>
  </div>

  <div class="w-full max-w-md p-4">
    <header class="flex justify-between items-center mb-4">
      <h1 class="text-xl font-bold text-yellow-400">Brawl Draft</h1>
      <div class="flex items-center gap-2">
        <div id="api-status" class="text-[10px] font-bold px-2 py-1 rounded-full bg-yellow-600 text-white animate-pulse">🟡 Conectando...</div>
        <button onclick="toggleSidebar()" class="bg-slate-800 p-2 rounded text-xl border border-slate-600 hover:bg-slate-700">⭐</button>
      </div>
    </header>

    <div class="flex bg-slate-800 rounded-lg p-1 mb-4 border border-slate-700">
      <button id="mode-casual" onclick="setMode('casual')" class="flex-1 py-1 text-sm font-bold rounded-md transition text-gray-400">Casual</button>
      <button id="mode-ranked" onclick="setMode('ranked')" class="flex-1 py-1 text-sm font-bold rounded-md bg-yellow-500 text-slate-900 transition shadow">Ranqueada</button>
    </div>

    <main class="space-y-4">
      <!-- 1. Mapa -->
      <div class="glass p-4 rounded-xl">
        <label class="block text-sm font-bold mb-2 text-gray-300">1. Rotação Atual</label>
        <select id="map-select" class="w-full bg-slate-800 text-white p-2 rounded-lg border border-slate-600 focus:outline-none mb-1 text-sm font-semibold" onchange="fetchMapStats()">
          <option value="">Carregando mapas...</option>
        </select>
        
        <div id="map-preview" class="hidden mt-3 rounded-lg border border-slate-600 overflow-hidden relative bg-slate-900 flex justify-center p-2">
          <img id="map-img" src="" class="h-32 object-contain" alt="Mapa" onerror="this.style.display='none'">
        </div>
        <div id="map-loading" class="text-[10px] text-blue-400 hidden mt-1">Sincronizando estatísticas...</div>
      </div>

      <div id="draft-area" class="space-y-4">
        <!-- 2. Turno -->
        <div class="glass p-4 rounded-xl">
          <label class="block text-sm font-bold mb-2 text-gray-300">2. Qual o seu turno?</label>
          <div class="flex gap-2">
            <button onclick="setTurn('first')" id="btn-first" class="flex-1 bg-blue-600 p-1.5 rounded text-sm font-bold opacity-50 transition">1º Pick</button>
            <button onclick="setTurn('mid')" id="btn-mid" class="flex-1 bg-purple-600 p-1.5 rounded text-sm font-bold opacity-50 transition">Meio (2º ao 5º)</button>
            <button onclick="setTurn('last')" id="btn-last" class="flex-1 bg-red-600 p-1.5 rounded text-sm font-bold opacity-50 transition">Último</button>
          </div>
        </div>

        <!-- 3. Inimigos -->
        <div class="glass p-4 rounded-xl" id="enemy-section" style="opacity: 0.5; pointer-events: none;">
          <label class="block text-sm font-bold mb-2 text-gray-300">3. Picks Inimigos</label>
          <div id="selected-enemies-container" class="flex flex-wrap gap-2 mb-3"></div>
          <div id="enemy-picker">
            <input type="text" id="enemy-search" placeholder="Adicionar brawler inimigo..." class="w-full bg-slate-800 text-white p-2 rounded-lg border border-slate-600 focus:outline-none mb-2 text-sm" oninput="renderEnemyGrid(this.value)">
            <div id="enemy-grid" class="grid grid-cols-5 gap-1.5 max-h-40 overflow-y-auto p-1"></div>
          </div>
        </div>
      </div>

      <!-- Análise da SUA ESCOLHA TRAVADA -->
      <div id="my-locked-pick" class="hidden glass p-4 rounded-xl border-2 border-green-500 shadow-[0_0_15px_rgba(34,197,94,0.3)]">
        <div class="flex justify-between items-start mb-3 border-b border-slate-600 pb-2">
          <div>
            <h3 class="text-xs text-green-400 font-bold uppercase tracking-wider">Sua Escolha Travada</h3>
            <span id="locked-name" class="text-xl font-bold text-white"></span>
          </div>
          <button onclick="unlockPick()" class="text-[10px] bg-slate-700 px-2 py-1 rounded hover:bg-slate-600 border border-slate-500">Trocar Brawler</button>
        </div>
        
        <div class="flex gap-4">
          <img id="locked-img" src="" class="w-16 h-16 rounded-lg border border-slate-500 bg-slate-900 shadow-lg object-cover">
          <div class="flex-1 space-y-2">
            <!-- BUILD IDEAL -->
            <div class="bg-slate-800/80 p-2 rounded border border-slate-600">
              <p class="text-[10px] text-gray-400 font-bold mb-1">Build Recomendada (API):</p>
              <div class="flex items-center gap-2 mb-1">
                <img id="locked-gadget-img" src="" class="w-4 h-4 rounded-full bg-black object-cover">
                <span id="locked-gadget-name" class="text-[9px] text-white truncate"></span>
              </div>
              <div class="flex items-center gap-2">
                <img id="locked-sp-img" src="" class="w-4 h-4 rounded-full bg-black object-cover">
                <span id="locked-sp-name" class="text-[9px] text-white truncate"></span>
              </div>
            </div>
          </div>
        </div>
        <!-- ALVOS -->
        <div id="locked-targets" class="mt-3 space-y-1"></div>
      </div>

      <!-- SUGESTÕES LIVRES -->
      <div id="suggestions-area" class="mt-4">
        <h2 class="text-lg font-bold mb-2 text-green-400 border-b border-green-800 pb-1 flex justify-between items-center">
          Sugestões de Pick:
          <span id="sugg-badge" class="text-[9px] bg-slate-700 text-slate-300 px-2 py-0.5 rounded font-normal">Aguardando</span>
        </h2>
        <p class="text-[10px] text-gray-400 mb-2">Clique em um brawler para travar sua escolha e ver seus alvos.</p>
        <div id="results" class="space-y-2"></div>
      </div>
    </main>
  </div>

  <!-- RAIO X (DEBUG PANEL) -->
  <button onclick="toggleXray()" class="fixed bottom-4 right-4 bg-slate-800 text-slate-400 border border-slate-600 rounded-full px-4 py-2 text-xs font-bold hover:bg-slate-700 hover:text-white transition z-50">
    🔍 Raio-X
  </button>

  <div id="xray-panel" class="fixed bottom-0 left-0 w-full h-1/2 bg-black/95 border-t border-slate-600 z-50 transform translate-y-full transition-transform p-4 overflow-y-auto text-[10px] font-mono text-green-400">
    <div class="flex justify-between items-center mb-2 border-b border-green-800 pb-2">
      <h3 class="font-bold text-sm text-green-500">Terminal de Debug (API)</h3>
      <button onclick="toggleXray()" class="text-white text-lg bg-red-600 rounded px-2">X</button>
    </div>
    <pre id="xray-log" class="whitespace-pre-wrap word-break"></pre>
  </div>

  <script>
    const classAdvantages = {
      "Assassin": ["Artillery", "Marksman"],
      "Tank": ["Assassin"],
      "Artillery": ["Tank", "Controller"],
      "Marksman": ["Controller", "Damage Dealer", "Tank"],
      "Controller": ["Assassin", "Tank"],
      "Damage Dealer": ["Tank", "Assassin"]
    };

    const tradutorModos = { 
      "Bounty": "Caça-Estrelas", "Brawl Ball": "Fute-Brawl", "Gem Grab": "Pique-Gema", 
      "Heist": "Roubo", "Hot Zone": "Zona Estratégica", "Knockout": "Nocaute", 
      "Wipeout": "Extermínio", "Showdown": "Combate", "Solo Showdown": "Combate Solo", "Duo Showdown": "Combate Duplo" 
    };
    
    // Tradutor de mapas expandido
    const tradutorMapas = { 
      "Shooting Star": "Tiro Aberto", "Snake Prairie": "Pradaria da Serpente", "Temple Ruins": "Ruínas do Templo", 
      "Hard Rock Mine": "Mina Rochosa", "Crystal Arcade": "Fliperama de Cristal", "Deathcap Trap": "Arapuca", 
      "Undermine": "Mina Subterrânea", "Deep Diner": "Lanchonete Profunda", "Skull Creek": "Arroio Esqueleto", 
      "Scorched Stone": "Pedra Escaldante", "Rockwall Brawl": "Encrenca Encurralada", "Feast Or Famine": "Tudo ou Nada", 
      "Double Swoosh": "Bote Duplo", "Outlaw Camp": "Acampamento Bandido", "Center Stage": "Palco Central", 
      "Flaring Phoenix": "Fênix Flamejante", "Belle's Rock": "Rocha da Belle", "Safe Zone": "Zona Segura", 
      "Hot Potato": "Batata Quente", "Kaboom Canyon": "Cânion Cabum", "Dueling Beetles": "Besouros Duelantes", 
      "Ring of Fire": "Anel de Fogo", "Open Plaza": "Praça Aberta", "Goldarm Gulch": "Ravina Goldarm", 
      "Pinball Dreams": "Sonhos de Pinball", "Out in the Open": "Ao Ar Livre", "New Perspective": "Nova Perspectiva", 
      "Goalkeeper's Dream": "Sonho de Goleiro", "Center Field": "Campo Central", "Stone Fort": "Forte de Pedra",
      "Canal Grande": "Canal Grande", "Excel": "Excel", "Rustic Arcade": "Fliperama Rústico", "Hideout": "Esconderijo"
    };

    let state = {
      mode: 'ranked', mapId: null, turn: null, enemyPicks: [], myPick: null, 
      mapTopBrawlers: [], currentWinRates: {}, allBrawlers: [], allMapsList: [],
      favorites: JSON.parse(localStorage.getItem('brawlFavorites')) || [],
      debugLog: []
    };

    function logDebug(msg, data = null) {
      const time = new Date().toLocaleTimeString();
      let logLine = `[${time}] ${msg}`;
      if (data) logLine += `\n${JSON.stringify(data, null, 2)}`;
      state.debugLog.unshift(logLine);
      document.getElementById('xray-log').innerText = state.debugLog.slice(0, 10).join('\n\n');
    }

    function toggleXray() {
      document.getElementById('xray-panel').classList.toggle('translate-y-full');
    }

    function translateText(engMode, engMap) {
      return `[${tradutorModos[engMode] || engMode}] ${tradutorMapas[engMap] || engMap}`;
    }

    function getFallbackAvatar(name) {
      return `https://ui-avatars.com/api/?name=${name}&background=1e293b&color=e2e8f0&size=128`;
    }

    async function initAPI() {
      try {
        logDebug("Iniciando requisição de Brawlers...");
        const brawlersRes = await fetch('https://api.brawlapi.com/v1/brawlers');
        const brawlersData = await brawlersRes.json();
        
        state.allBrawlers = brawlersData.list.map(b => ({
          name: b.name, 
          image: b.imageUrl2 || b.imageUrl,
          className: b.class.name,
          gadget: b.gadgets.length > 0 ? b.gadgets[0] : null,
          starPower: b.starPowers.length > 0 ? b.starPowers[0] : null
        })).sort((a, b) => a.name.localeCompare(b.name));
        logDebug(`Carregados ${state.allBrawlers.length} Brawlers.`);

        renderEnemyGrid();
        renderFavoritesList();

        logDebug("Buscando eventos e mapas ao vivo...");
        const [eventsRes, mapsRes] = await Promise.all([
          fetch('https://api.brawlapi.com/v1/events').catch(() => ({ json: () => ({ active: [] }) })),
          fetch('https://api.brawlapi.com/v1/maps').catch(() => ({ json: () => ({ list: [] }) }))
        ]);
        
        const eventsData = await eventsRes.json();
        const mapsData = await mapsRes.json();

        state.allMapsList = mapsData.list || [];
        
        // CORREÇÃO CRÍTICA DO SINALIZADOR DE MAPAS ATIVOS
        const activeMapIds = eventsData.active ? eventsData.active.filter(ev => ev.map).map(ev => Number(ev.map.id)) : [];
        logDebug(`Mapas Ativos detectados: ${activeMapIds.length}`);

        const mapSelect = document.getElementById('map-select');
        mapSelect.innerHTML = '<option value="">Selecione o mapa...</option>';

        const activeMaps = state.allMapsList.filter(m => activeMapIds.includes(Number(m.id)));
        if(activeMaps.length > 0) {
          mapSelect.innerHTML += `<optgroup label="=== AO VIVO AGORA ===">`;
          // Adicionado sinalizador explícito (🟢 Ao Vivo)
          activeMaps.forEach(m => mapSelect.innerHTML += `<option value="${m.id}">🟢 Ao Vivo: ${translateText(m.gameMode.name, m.name)}</option>`);
          mapSelect.innerHTML += `</optgroup>`;
        }

        const otherMaps = state.allMapsList.filter(m => !activeMapIds.includes(Number(m.id)));
        mapSelect.innerHTML += `<optgroup label="=== Outros Mapas ===">`;
        // Adicionado sinalizador explícito (⚪)
        otherMaps.forEach(m => mapSelect.innerHTML += `<option value="${m.id}">⚪ ${translateText(m.gameMode.name, m.name)}</option>`);
        mapSelect.innerHTML += `</optgroup>`;

        document.getElementById('api-status').innerText = '🟢 Conectado';
        document.getElementById('api-status').classList.replace('bg-yellow-600', 'bg-green-600');
        document.getElementById('api-status').classList.remove('animate-pulse');
      } catch (e) {
        logDebug("ERRO CRÍTICO NA API", e.message);
        document.getElementById('api-status').innerText = '🔴 Erro API';
        document.getElementById('api-status').classList.replace('bg-yellow-600', 'bg-red-600');
      }
    }

    async function fetchMapStats() {
      state.mapId = document.getElementById('map-select').value;
      const previewBox = document.getElementById('map-preview');
      const imgEl = document.getElementById('map-img');

      if (!state.mapId) { previewBox.classList.add('hidden'); return; }

      const selectedMap = state.allMapsList.find(m => m.id == state.mapId);
      if (selectedMap && selectedMap.imageUrl) { 
        imgEl.style.display = 'block';
        imgEl.src = selectedMap.imageUrl;
        previewBox.classList.remove('hidden');
      } else {
        previewBox.classList.add('hidden');
      }
      
      document.getElementById('map-loading').style.display = 'block';
      logDebug(`Buscando estatísticas para o mapa ID: ${state.mapId}`);
      
      try {
        const res = await fetch(`https://api.brawlapi.com/v1/maps/${state.mapId}`);
        const data = await res.json();
        
        state.currentWinRates = {};
        
        // PROTEÇÃO CONTRA LISTA VAZIA (FALLBACK)
        if (data.stats && data.stats.length > 0) {
          data.stats.forEach(s => { state.currentWinRates[s.brawler.name] = s.winRate; });
          state.mapTopBrawlers = data.stats.sort((a, b) => b.winRate - a.winRate);
          logDebug(`Estatísticas baixadas: ${data.stats.length} brawlers encontrados no meta.`);
        } else {
          // A API NÃO RETORNOU DADOS PARA ESSE MAPA! Aciona o Fallback.
          state.mapTopBrawlers = [];
          logDebug(`⚠️ A API retornou 0 estatísticas para este mapa. Usando Fallback de Classes.`);
        }
      } catch (e) {
        state.mapTopBrawlers = [];
        logDebug(`⚠️ Falha ao ler estatísticas do mapa. Erro: ${e.message}`);
      }
      
      document.getElementById('map-loading').style.display = 'none';
      renderEnemyGrid();
      renderFavoritesList();
      
      if(state.myPick) renderTargetAnalysis();
      else updateRecommendations();
    }

    function setMode(mode) {
      state.mode = mode;
      document.getElementById('mode-casual').className = mode === 'casual' ? 'flex-1 py-1 text-sm font-bold rounded-md bg-yellow-500 text-slate-900 shadow' : 'flex-1 py-1 text-sm font-bold rounded-md text-gray-400';
      document.getElementById('mode-ranked').className = mode === 'ranked' ? 'flex-1 py-1 text-sm font-bold rounded-md bg-yellow-500 text-slate-900 shadow' : 'flex-1 py-1 text-sm font-bold rounded-md text-gray-400';
      document.getElementById('draft-area').style.display = mode === 'casual' ? 'none' : 'block';
      if(!state.myPick) updateRecommendations();
    }

    function setTurn(turn) {
      state.turn = turn;
      ['first', 'mid', 'last'].forEach(t => document.getElementById(`btn-${t}`).style.opacity = '0.5');
      document.getElementById(`btn-${turn}`).style.opacity = '1';
      
      const eSec = document.getElementById('enemy-section');
      if (turn === 'first') {
        eSec.style.opacity = '0.5'; eSec.style.pointerEvents = 'none';
        state.enemyPicks = [];
        renderSelectedEnemies();
      } else {
        eSec.style.opacity = '1'; eSec.style.pointerEvents = 'auto';
      }
      if(!state.myPick) updateRecommendations();
    }

    function renderEnemyGrid(filter = '') {
      const grid = document.getElementById('enemy-grid');
      grid.innerHTML = '';
      let filtered = state.allBrawlers.filter(b => b.name.toLowerCase().includes(filter.toLowerCase()) && !state.enemyPicks.includes(b.name));
      
      // Ordena por Win Rate (se existir)
      filtered.sort((a, b) => {
        const wrA = state.currentWinRates[a.name] || 0, wrB = state.currentWinRates[b.name] || 0;
        return wrB !== wrA ? wrB - wrA : a.name.localeCompare(b.name);
      });
      
      filtered.forEach(b => {
        const wr = state.currentWinRates[b.name] ? `<div class="absolute top-0.5 right-0.5 bg-slate-900/80 text-gray-300 text-[8px] px-1 rounded pointer-events-none">${state.currentWinRates[b.name]}%</div>` : '';
        grid.innerHTML += `
          <div onclick="addEnemy('${b.name}')" class="relative cursor-pointer hover:scale-105 rounded overflow-hidden">
            <img src="${b.image}" onerror="this.src='${getFallbackAvatar(b.name)}'" class="w-full aspect-square object-cover bg-slate-900 border border-slate-600 hover:border-red-400">
            ${wr}
          </div>`;
      });
    }

    function addEnemy(name) {
      if (state.enemyPicks.length >= 5) return;
      state.enemyPicks.push(name);
      document.getElementById('enemy-search').value = '';
      renderSelectedEnemies(); renderEnemyGrid(); 
      if(state.myPick) renderTargetAnalysis(); else updateRecommendations();
    }

    function removeEnemy(name) {
      state.enemyPicks = state.enemyPicks.filter(e => e !== name);
      renderSelectedEnemies(); renderEnemyGrid(); 
      if(state.myPick) renderTargetAnalysis(); else updateRecommendations();
    }

    function renderSelectedEnemies() {
      const container = document.getElementById('selected-enemies-container');
      container.innerHTML = '';
      state.enemyPicks.forEach(name => {
        const bInfo = state.allBrawlers.find(b => b.name === name);
        if (bInfo) {
          container.innerHTML += `
            <div class="flex items-center gap-1 bg-red-950/60 p-1 pr-2 rounded border border-red-900">
              <img src="${bInfo.image}" onerror="this.src='${getFallbackAvatar(name)}'" class="w-6 h-6 rounded bg-slate-900 object-cover">
              <span class="text-xs font-bold text-white">${name}</span>
              <button onclick="removeEnemy('${name}')" class="ml-1 text-red-500 hover:text-red-300 font-bold">X</button>
            </div>`;
        }
      });
    }

    function selectMyPick(name) {
      state.myPick = name;
      document.getElementById('suggestions-area').classList.add('hidden');
      document.getElementById('my-locked-pick').classList.remove('hidden');
      
      const bInfo = state.allBrawlers.find(b => b.name === name);
      document.getElementById('locked-name').innerText = name;
      document.getElementById('locked-img').src = bInfo.image;
      
      // Builds
      if(bInfo.gadget) {
        document.getElementById('locked-gadget-img').src = bInfo.gadget.imageUrl;
        document.getElementById('locked-gadget-name').innerText = bInfo.gadget.name;
      }
      if(bInfo.starPower) {
        document.getElementById('locked-sp-img').src = bInfo.starPower.imageUrl;
        document.getElementById('locked-sp-name').innerText = bInfo.starPower.name;
      }
      
      renderTargetAnalysis();
    }

    function unlockPick() {
      state.myPick = null;
      document.getElementById('my-locked-pick').classList.add('hidden');
      document.getElementById('suggestions-area').classList.remove('hidden');
      updateRecommendations();
    }

    function renderTargetAnalysis() {
      if(!state.myPick) return;
      const tContainer = document.getElementById('locked-targets');
      tContainer.innerHTML = '';
      
      if(state.enemyPicks.length === 0) {
        tContainer.innerHTML = '<p class="text-[10px] text-gray-400 mt-2">Adicione inimigos no passo 3 para ver em quem focar.</p>';
        return;
      }

      const myInfo = state.allBrawlers.find(b => b.name === state.myPick);
      
      state.enemyPicks.forEach(enemyName => {
        const eInfo = state.allBrawlers.find(b => b.name === enemyName);
        let statusHtml = '';
        
        if (classAdvantages[myInfo.className] && classAdvantages[myInfo.className].includes(eInfo.className)) {
          statusHtml = `<span class="bg-green-900 text-green-300 text-[10px] px-2 py-0.5 rounded border border-green-700 font-bold ml-auto">🎯 Focar</span>`;
        } 
        else if (classAdvantages[eInfo.className] && classAdvantages[eInfo.className].includes(myInfo.className)) {
          statusHtml = `<span class="bg-red-900 text-red-300 text-[10px] px-2 py-0.5 rounded border border-red-700 font-bold ml-auto">⚠️ Evite</span>`;
        }
        else {
          statusHtml = `<span class="text-gray-500 text-[10px] font-bold ml-auto">Neutro</span>`;
        }

        tContainer.innerHTML += `
          <div class="flex items-center gap-2 bg-slate-800 p-1.5 rounded border border-slate-600">
            <img src="${eInfo.image}" onerror="this.src='${getFallbackAvatar(eInfo.name)}'" class="w-6 h-6 rounded bg-slate-900 object-cover">
            <span class="text-xs text-white">${eInfo.name}</span>
            <span class="text-[9px] text-gray-400">(${eInfo.className})</span>
            ${statusHtml}
          </div>
        `;
      });
    }

    function updateRecommendations() {
      const resDiv = document.getElementById('results');
      const badge = document.getElementById('sugg-badge');
      resDiv.innerHTML = '';

      if (!state.mapId) { 
        resDiv.innerHTML = '<p class="text-xs text-gray-400">Selecione o mapa acima.</p>'; 
        badge.innerText = "Aguardando"; badge.className = "text-[9px] bg-slate-700 text-slate-300 px-2 py-0.5 rounded font-normal";
        return; 
      }
      if (state.mode === 'ranked' && !state.turn) { 
        resDiv.innerHTML = '<p class="text-xs text-gray-400">Selecione o seu turno.</p>'; 
        badge.innerText = "Aguardando"; badge.className = "text-[9px] bg-slate-700 text-slate-300 px-2 py-0.5 rounded font-normal";
        return; 
      }

      // FALLBACK ANTI-APAGÃO: Se a API falhou em dar Win Rates (mapTopBrawlers vazio), cria uma lista base genérica com Win Rate "Neutro" (50%).
      let baseData = state.mapTopBrawlers;
      let usingFallback = false;
      
      if (baseData.length === 0) {
        usingFallback = true;
        badge.innerText = "Tática Pura (Sem Dados do Mapa)";
        badge.className = "text-[9px] bg-purple-900 text-purple-300 border border-purple-700 px-2 py-0.5 rounded font-bold";
        baseData = state.allBrawlers.map(b => ({ brawler: { name: b.name }, winRate: 50 }));
      } else {
        badge.innerText = "Meta Atual (API)";
        badge.className = "text-[9px] bg-green-900 text-green-300 border border-green-700 px-2 py-0.5 rounded font-bold";
      }

      let candidatos = baseData.map(apiB => {
        let bInfo = state.allBrawlers.find(b => b.name === apiB.brawler.name);
        return { 
          name: apiB.brawler.name, image: bInfo ? bInfo.image : '',
          className: bInfo ? bInfo.className : '', winRate: apiB.winRate, 
          isFav: state.favorites.includes(apiB.brawler.name), score: apiB.winRate
        };
      });

      if (state.mode === 'ranked') {
        candidatos = candidatos.filter(b => !state.enemyPicks.includes(b.name));
        
        if (state.turn === 'mid' || state.turn === 'last') {
          // Ajusta o score puramente baseado na Matriz de Vantagens
          candidatos.forEach(c => {
            state.enemyPicks.forEach(enemyName => {
              const enemyClass = state.allBrawlers.find(e => e.name === enemyName)?.className;
              // Bônus se bate no inimigo
              if (classAdvantages[c.className] && classAdvantages[c.className].includes(enemyClass)) c.score += (usingFallback ? 10 : 3);
              // Penalidade severa se apanha do inimigo
              if (classAdvantages[enemyClass] && classAdvantages[enemyClass].includes(c.className)) c.score -= (usingFallback ? 20 : 6);
            });
          });
        }
      }

      // Ordena
      candidatos.sort((a, b) => (b.isFav === a.isFav) ? (b.score - a.score) : (b.isFav ? 1 : -1));
      
      const best = candidatos.slice(0, 5);
      
      if(best.length === 0) {
        resDiv.innerHTML = '<p class="text-xs text-yellow-400">Nenhum Brawler atende os critérios.</p>';
        return;
      }
      
      best.forEach(b => {
        const starHtml = b.isFav ? `<div class="absolute -top-2 -left-2 text-xl drop-shadow-md z-20">⭐</div>` : '';
        const wrText = usingFallback ? `Score: ${b.score}` : `WR: ${b.winRate}%`;
        
        resDiv.innerHTML += `
          <div onclick="selectMyPick('${b.name}')" class="cursor-pointer glass p-2 rounded-lg border-l-4 ${b.isFav ? 'border-yellow-400 bg-yellow-900/10' : 'border-green-500'} flex items-center gap-3 hover:bg-slate-700 transition relative">
            ${starHtml}
            <img src="${b.image}" onerror="this.src='${getFallbackAvatar(b.name)}'" class="w-10 h-10 rounded border border-slate-600 bg-slate-900 shadow-lg object-cover">
            <div class="flex-1">
              <span class="font-bold text-base text-white block">${b.name}</span>
              <span class="text-[9px] text-gray-400">${b.className}</span>
            </div>
            <span class="text-[10px] bg-green-900/80 text-green-200 px-1.5 py-0.5 rounded border border-green-700/50 font-bold whitespace-nowrap">${wrText}</span>
          </div>
        `;
      });
    }

    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('translate-x-full'); document.getElementById('sidebar-overlay').classList.toggle('hidden'); }
    function renderFavoritesList(filter = '') {
      const list = document.getElementById('favorites-list'); list.innerHTML = '';
      let filtered = state.allBrawlers.filter(b => b.name.toLowerCase().includes(filter.toLowerCase()));
      filtered.sort((a, b) => {
        const aFav = state.favorites.includes(a.name), bFav = state.favorites.includes(b.name);
        if (aFav && !bFav) return -1; if (!aFav && bFav) return 1;
        const wrA = state.currentWinRates[a.name] || 0, wrB = state.currentWinRates[b.name] || 0;
        return wrB !== wrA ? wrB - wrA : a.name.localeCompare(b.name);
      });
      filtered.forEach(b => {
        const isFav = state.favorites.includes(b.name);
        const style = isFav ? 'border-2 border-yellow-400 opacity-100' : 'border border-slate-700 opacity-50 hover:opacity-100';
        const wr = state.currentWinRates[b.name] ? `<span class="absolute top-0 right-0 bg-slate-900/80 text-gray-300 text-[8px] px-1 rounded-bl-lg">${state.currentWinRates[b.name]}%</span>` : '';
        list.innerHTML += `<div onclick="toggleFav('${b.name}')" class="cursor-pointer flex flex-col items-center gap-1 relative"><img src="${b.image}" onerror="this.src='${getFallbackAvatar(b.name)}'" class="w-full aspect-square object-cover rounded-lg bg-slate-800 ${style}"><span class="text-[9px] truncate w-full text-center ${isFav ? 'text-yellow-400 font-bold' : 'text-gray-400'}">${b.name}</span>${wr}</div>`;
      });
    }
    function toggleFav(brawlerName) {
      if (state.favorites.includes(brawlerName)) state.favorites = state.favorites.filter(f => f !== brawlerName);
      else state.favorites.push(brawlerName);
      localStorage.setItem('brawlFavorites', JSON.stringify(state.favorites));
      renderFavoritesList(document.getElementById('fav-search').value);
      if(!state.myPick) updateRecommendations();
    }

    initAPI();
  </script>
</body>
</html>
