<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brawl Draft Pro - Super Raio-X</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #121826; color: #e2e8f0; overflow-x: hidden; }
    .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    #sidebar { transition: transform 0.3s ease-in-out; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1e293b; border-radius: 4px; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    
    /* SUPER RAIO-X TERMINAL */
    #super-debug { 
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.95); z-index: 9999; 
      display: flex; flex-direction: column; padding: 20px; font-family: 'Courier New', Courier, monospace; 
    }
    #debug-log { flex: 1; overflow-y: auto; background: #0a0a0a; border: 1px solid #333; padding: 10px; border-radius: 8px; font-size: 11px; }
    .log-sys { color: #0ea5e9; font-weight: bold; margin-top: 10px; border-bottom: 1px dashed #0ea5e9; padding-bottom: 4px;}
    .log-info { color: #a1a1aa; }
    .log-success { color: #22c55e; }
    .log-warn { color: #eab308; }
    .log-error { color: #ef4444; font-weight: bold; }
    .log-raw { color: #d946ef; font-size: 9px; margin-left: 10px; white-space: pre-wrap; word-wrap: break-word; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center pb-12">

  <div id="super-debug">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-green-400 font-bold text-xl">⚡ SUPER RAIO-X DE CONEXÃO ⚡</h2>
      <button onclick="toggleSuperDebug()" class="bg-red-600 text-white px-4 py-2 rounded font-bold hover:bg-red-500">FECHAR RAIO-X (Ir para o App)</button>
    </div>
    <div id="debug-log"></div>
    <div class="mt-4 flex gap-2">
      <button onclick="runFullDiagnostics()" class="bg-blue-600 px-4 py-2 rounded font-bold hover:bg-blue-500">🔄 Forçar Diagnóstico Completo</button>
      <button onclick="document.getElementById('debug-log').innerHTML=''" class="bg-slate-700 px-4 py-2 rounded font-bold hover:bg-slate-600">Limpar Log</button>
    </div>
  </div>

  <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden" onclick="toggleSidebar()"></div>
  <div id="sidebar" class="fixed top-0 right-0 h-full w-72 bg-slate-900 border-l border-slate-700 z-50 transform translate-x-full p-4 overflow-hidden flex flex-col">
    <div class="flex justify-between items-center mb-4 shrink-0">
      <h2 class="font-bold text-yellow-400">Meus Brawlers</h2>
      <button onclick="toggleSidebar()" class="text-gray-400 hover:text-white text-xl">&times;</button>
    </div>
    <input type="text" id="fav-search" placeholder="Buscar..." class="w-full bg-slate-800 text-white p-2 rounded-lg border border-slate-600 focus:outline-none mb-3 text-sm shrink-0" oninput="renderFavoritesList(this.value)">
    <div id="favorites-list" class="grid grid-cols-4 gap-2 overflow-y-auto pb-4"></div>
  </div>

  <div class="w-full max-w-md p-4">
    <header class="flex justify-between items-center mb-4">
      <h1 class="text-xl font-bold text-yellow-400">Brawl Draft</h1>
      <div class="flex items-center gap-2">
        <div id="api-status" class="text-[10px] font-bold px-2 py-1 rounded-full bg-yellow-600 text-white animate-pulse">🟡 Diagnosticando...</div>
        <button onclick="toggleSidebar()" class="bg-slate-800 p-2 rounded text-xl border border-slate-600 hover:bg-slate-700">⭐</button>
      </div>
    </header>

    <div class="flex bg-slate-800 rounded-lg p-1 mb-4 border border-slate-700">
      <button id="mode-casual" onclick="setMode('casual')" class="flex-1 py-1 text-sm font-bold rounded-md transition text-gray-400">Casual</button>
      <button id="mode-ranked" onclick="setMode('ranked')" class="flex-1 py-1 text-sm font-bold rounded-md bg-yellow-500 text-slate-900 transition shadow">Ranqueada</button>
    </div>

    <main class="space-y-4">
      <div class="glass p-4 rounded-xl">
        <label class="block text-sm font-bold mb-2 text-gray-300">1. Rotação Atual</label>
        <select id="map-select" class="w-full bg-slate-800 text-white p-2 rounded-lg border border-slate-600 focus:outline-none mb-1 text-sm" onchange="fetchMapStats()">
          <option value="">Aguardando conexão...</option>
        </select>
        
        <div id="map-preview" class="hidden mt-3 rounded-lg border border-slate-600 overflow-hidden relative bg-slate-900 flex justify-center">
          <img id="map-img" src="" class="h-32 object-contain" alt="Mapa" onerror="this.style.display='none'">
        </div>
        <div id="map-loading" class="text-[10px] text-blue-400 hidden mt-1">Calculando dados...</div>
      </div>

      <div id="draft-area" class="space-y-4">
        <div class="glass p-4 rounded-xl">
          <label class="block text-sm font-bold mb-2 text-gray-300">2. Qual o seu turno?</label>
          <div class="flex gap-2">
            <button onclick="setTurn('first')" id="btn-first" class="flex-1 bg-blue-600 p-1.5 rounded text-sm font-bold opacity-50 transition">1º Pick</button>
            <button onclick="setTurn('mid')" id="btn-mid" class="flex-1 bg-purple-600 p-1.5 rounded text-sm font-bold opacity-50 transition">Meio (2º ao 5º)</button>
            <button onclick="setTurn('last')" id="btn-last" class="flex-1 bg-red-600 p-1.5 rounded text-sm font-bold opacity-50 transition">Último</button>
          </div>
        </div>

        <div class="glass p-4 rounded-xl" id="enemy-section" style="opacity: 0.5; pointer-events: none;">
          <label class="block text-sm font-bold mb-2 text-gray-300">3. Picks Inimigos</label>
          <div id="selected-enemies-container" class="flex flex-wrap gap-2 mb-3"></div>
          <div id="enemy-picker">
            <input type="text" id="enemy-search" placeholder="Adicionar brawler inimigo..." class="w-full bg-slate-800 text-white p-2 rounded-lg border border-slate-600 focus:outline-none mb-2 text-sm" oninput="renderEnemyGrid(this.value)">
            <div id="enemy-grid" class="grid grid-cols-5 gap-1.5 max-h-40 overflow-y-auto p-1"></div>
          </div>
        </div>
      </div>

      <div id="my-locked-pick" class="hidden glass p-4 rounded-xl border-2 border-green-500 shadow-[0_0_15px_rgba(34,197,94,0.3)]">
        <div class="flex justify-between items-start mb-3 border-b border-slate-600 pb-2">
          <div>
            <h3 class="text-xs text-green-400 font-bold uppercase tracking-wider">Sua Escolha Travada</h3>
            <span id="locked-name" class="text-xl font-bold text-white"></span>
          </div>
          <button onclick="unlockPick()" class="text-[10px] bg-slate-700 px-2 py-1 rounded hover:bg-slate-600">Trocar</button>
        </div>
        
        <div class="flex gap-4">
          <img id="locked-img" src="" class="w-16 h-16 rounded-lg border border-slate-500 bg-slate-900 shadow-lg">
          <div class="flex-1 space-y-2">
            <div class="bg-slate-800/80 p-2 rounded border border-slate-600">
              <p class="text-[10px] text-gray-400 font-bold mb-1">Build Recomendada:</p>
              <div class="flex items-center gap-2 mb-1">
                <img id="locked-gadget-img" src="" class="w-4 h-4 rounded-full bg-black">
                <span id="locked-gadget-name" class="text-[9px] text-white truncate max-w-[120px]"></span>
              </div>
              <div class="flex items-center gap-2 mb-2">
                <img id="locked-sp-img" src="" class="w-4 h-4 rounded-full bg-black">
                <span id="locked-sp-name" class="text-[9px] text-white truncate max-w-[120px]"></span>
              </div>
            </div>
          </div>
        </div>

        <div id="locked-targets" class="mt-3 space-y-1"></div>
      </div>

      <div id="suggestions-area" class="mt-4">
        <div class="flex justify-between items-end mb-2 border-b border-green-800 pb-1">
          <h2 class="text-lg font-bold text-green-400">Sugestões de Pick:</h2>
          <span id="fallback-badge" class="hidden text-[8px] bg-purple-900 text-purple-300 px-1.5 py-0.5 rounded border border-purple-700">Tática Pura (Offline)</span>
        </div>
        <p class="text-[10px] text-gray-400 mb-2">Clique em um brawler para travar sua escolha.</p>
        <div id="results" class="space-y-2"></div>
      </div>

    </main>
  </div>

  <button onclick="toggleSuperDebug()" class="fixed bottom-2 right-2 bg-slate-800 text-green-400 font-bold text-[10px] px-3 py-2 rounded border border-green-600 shadow-[0_0_10px_rgba(34,197,94,0.5)] z-40">ABRIR RAIO-X</button>

  <script>
    // --- SISTEMA SUPER RAIO-X DE DIAGNÓSTICO ---
    function logX(msg, type='info') {
      const term = document.getElementById('debug-log');
      const time = new Date().toISOString().substring(11, 19);
      let html = `<div class="log-${type}">[${time}] ${msg}</div>`;
      term.innerHTML += html;
      term.scrollTop = term.scrollHeight;
    }

    function toggleSuperDebug() {
      const term = document.getElementById('super-debug');
      term.style.display = term.style.display === 'none' ? 'flex' : 'none';
    }

    // O Motor Híbrido que tenta 4 caminhos diferentes e loga tudo
    async function fetchDiagnostico(endpoint, checkKey) {
      const baseUrl = `https://api.brawlapi.com/v1/${endpoint}`;
      logX(`======= INICIANDO TESTE DE ROTA: /${endpoint} =======`, 'sys');

      const caminhos = [
        { nome: 'DIRETA', url: baseUrl, isJSONP: false },
        { nome: 'TÚNEL ALLORIGINS', url: `https://api.allorigins.win/get?url=${encodeURIComponent(baseUrl)}`, isWrapper: true },
        { nome: 'PROXY CODETABS', url: `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(baseUrl)}`, isJSONP: false },
        { nome: 'PROXY CORS.IO', url: `https://corsproxy.io/?${encodeURIComponent(baseUrl)}`, isJSONP: false }
      ];

      for (let caminho of caminhos) {
        try {
          logX(`⏳ Testando caminho [${caminho.nome}]...`, 'info');
          const t0 = performance.now();
          
          const cacheBuster = caminho.url.includes('?') ? `&t=${Date.now()}` : `?t=${Date.now()}`;
          const res = await fetch(caminho.url + cacheBuster, { cache: 'no-store' });
          const t1 = performance.now();
          
          logX(`👉 Resposta [${caminho.nome}]: HTTP ${res.status} ${res.statusText} (${Math.round(t1 - t0)}ms)`, res.ok ? 'success' : 'warn');

          if (!res.ok) {
            logX(`❌ Servidor bloqueou com código ${res.status}. Tentando próximo...`, 'error');
            continue; // Pula pro próximo caminho
          }

          let data;
          if (caminho.isWrapper) {
            const wrapper = await res.json();
            if (!wrapper.contents) throw new Error("AllOrigins retornou vazio.");
            data = JSON.parse(wrapper.contents);
          } else {
            data = await res.json();
          }

          // Checa se a API respondeu 200 OK mas mandou array vazio []
          if (checkKey && (!data[checkKey] || data[checkKey].length === 0)) {
            logX(`⚠️ AVISO: Caminho conectou, mas a lista '${checkKey}' está VAZIA. A API deles pode estar em manutenção!`, 'warn');
            logX(`Conteúdo cru recebido:`, 'info');
            logX(JSON.stringify(data).substring(0, 150) + '...', 'raw');
            continue;
          }

          logX(`✅ SUCESSO ABSOLUTO via [${caminho.nome}]! Encontrados ${data[checkKey] ? data[checkKey].length : 'dados'} itens.`, 'success');
          return data;

        } catch (err) {
          logX(`❌ ERRO no [${caminho.nome}]: ${err.name} - ${err.message}`, 'error');
        }
      }

      logX(`🚨 FALHA CRÍTICA: Todas as 4 rotas de rede falharam ou a API está 100% vazia para /${endpoint}. Ativando Banco de Dados Offline.`, 'error');
      return {}; // Aciona o fallback offline
    }

    // Funções do Jogo (Tática Offline)
    const classAdvantages = {
      "Assassin": ["Artillery", "Marksman"], "Tank": ["Assassin"], "Artillery": ["Tank", "Controller"],
      "Marksman": ["Controller", "Damage Dealer", "Tank"], "Controller": ["Assassin", "Tank"],
      "Damage Dealer": ["Tank", "Assassin"], "Support": []
    };

    const mapDNA = {
      "snakeprairie": { name: "Pradaria da Serpente", boost: ["Tank", "Assassin", "Support"], punish: ["Marksman", "Artillery"], specificBoost: ["Bo", "Tara", "Rosa", "Jacky"] },
      "cavernchurn": { name: "Caverna Convulsiva", boost: ["Artillery", "Tank"], punish: ["Marksman"], specificBoost: ["Rico", "Dynamike"] },
      "shootingstar": { name: "Tiro Aberto", boost: ["Marksman", "Damage Dealer"], punish: ["Tank"], specificBoost: ["Piper", "Nani", "Mandy"] },
      "outintheopen": { name: "Ao Ar Livre", boost: ["Marksman", "Damage Dealer"], punish: ["Tank"], specificBoost: ["Angelo", "Piper"] },
      "ringoffire": { name: "Anel de Fogo", boost: ["Controller", "Artillery"], punish: ["Assassin"], specificBoost: [] },
      "hardrockmine": { name: "Mina Rochosa", boost: ["Controller", "Damage Dealer"], punish: [], specificBoost: ["Sandy"] },
      "crystalarcade": { name: "Fliperama de Cristal", boost: ["Marksman", "Assassin"], punish: ["Tank"], specificBoost: [] },
      "stonefort": { name: "Forte de Pedra", boost: ["Artillery", "Controller"], punish: ["Assassin"], specificBoost: ["Barley", "Tick"] }
    };

    let state = {
      mode: 'ranked', mapId: null, turn: null, enemyPicks: [], myPick: null, 
      mapTopBrawlers: [], currentWinRates: {}, allBrawlers: [], allMapsList: [],
      isOfflineFallback: false, favorites: JSON.parse(localStorage.getItem('brawlFavorites')) || []
    };

    function translateText(engMode, engMap) { return `[${engMode}] ${engMap}`; }
    function getFallbackAvatar(name) { return `https://ui-avatars.com/api/?name=${name}&background=1e293b&color=e2e8f0&size=128`; }
    function normalizeStr(str) { return str.replace(/[^a-zA-Z0-9]/g, "").toLowerCase(); }

    async function runFullDiagnostics() {
      document.getElementById('debug-log').innerHTML = '';
      logX("🚀 INICIANDO DIAGNÓSTICO COMPLETO A PEDIDO DO USUÁRIO...", "sys");
      await initAPI();
    }

    async function initAPI() {
      try {
        const brawlersData = await fetchDiagnostico('brawlers', 'list');
        
        if(brawlersData.list) {
          state.allBrawlers = brawlersData.list.map(b => ({
            name: b.name, image: b.imageUrl2 || b.imageUrl, className: b.class.name,
            gadget: b.gadgets.length > 0 ? b.gadgets[0] : null,
            starPower: b.starPowers.length > 0 ? b.starPowers[0] : null,
            gears: b.gears || []
          })).sort((a, b) => a.name.localeCompare(b.name));
        }

        renderEnemyGrid(); renderFavoritesList();

        const [eventsData, mapsData] = await Promise.all([
          fetchDiagnostico('events', 'active'),
          fetchDiagnostico('maps', 'list')
        ]);

        state.allMapsList = mapsData.list || [];
        const activeMapIds = eventsData.active ? eventsData.active.filter(ev => ev.map).map(ev => Number(ev.map.id)) : [];
        
        const mapSelect = document.getElementById('map-select');
        mapSelect.innerHTML = '<option value="">Selecione o mapa...</option>';

        const activeMaps = state.allMapsList.filter(m => activeMapIds.includes(Number(m.id)));
        if(activeMaps.length > 0) {
          mapSelect.innerHTML += `<optgroup label="🟢 Ao Vivo Agora">`;
          activeMaps.forEach(m => mapSelect.innerHTML += `<option value="${m.id}">${translateText(m.gameMode.name, m.name)}</option>`);
          mapSelect.innerHTML += `</optgroup>`;
        }

        const otherMaps = state.allMapsList.filter(m => !activeMapIds.includes(Number(m.id)));
        if(otherMaps.length > 0) {
          mapSelect.innerHTML += `<optgroup label="⚪ Outros Mapas">`;
          otherMaps.forEach(m => mapSelect.innerHTML += `<option value="${m.id}">${translateText(m.gameMode.name, m.name)}</option>`);
          mapSelect.innerHTML += `</optgroup>`;
        }

        if(activeMaps.length === 0 && otherMaps.length === 0) throw new Error("Listas vazias");

        document.getElementById('api-status').innerText = '🟢 Online';
        document.getElementById('api-status').classList.replace('bg-yellow-600', 'bg-green-600');
        document.getElementById('api-status').classList.remove('animate-pulse');
        
        logX("🎉 SETUP INICIAL CONCLUÍDO. O site está pronto para uso.", "sys");
      } catch (e) {
        document.getElementById('api-status').innerText = '🔴 Offline';
        document.getElementById('api-status').classList.replace('bg-yellow-600', 'bg-red-600');
        logX("💀 FALHA GERAL NO SETUP. A API recusa-se a entregar os mapas e brawlers básicos.", "error");
      }
    }

    async function fetchMapStats() {
      state.mapId = document.getElementById('map-select').value;
      const previewBox = document.getElementById('map-preview');
      const imgEl = document.getElementById('map-img');

      if (!state.mapId) { previewBox.classList.add('hidden'); return; }

      const selectedMap = state.allMapsList.find(m => m.id == state.mapId);
      if (selectedMap && selectedMap.imageUrl) {
        imgEl.style.display = 'block'; imgEl.src = selectedMap.imageUrl;
        previewBox.classList.remove('hidden');
      } else {
        previewBox.classList.add('hidden');
      }
      
      document.getElementById('map-loading').style.display = 'block';
      
      // DIAGNÓSTICO DO MAPA ESPECÍFICO
      const data = await fetchDiagnostico(`maps/${state.mapId}`, 'stats');
      
      state.currentWinRates = {};
      state.isOfflineFallback = false;

      if (!data.stats || data.stats.length === 0) {
        logX(`⚠️ Acionando Inteligência Artificial (DNA) para este mapa porque a API falhou.`, 'sys');
        state.isOfflineFallback = true;
        document.getElementById('fallback-badge').classList.remove('hidden');
        state.mapTopBrawlers = state.allBrawlers.map(b => ({ brawler: { name: b.name }, winRate: 50 }));
      } else {
        document.getElementById('fallback-badge').classList.add('hidden');
        data.stats.forEach(s => { state.currentWinRates[s.brawler.name] = s.winRate; });
        state.mapTopBrawlers = data.stats.sort((a, b) => b.winRate - a.winRate);
      }
      
      document.getElementById('map-loading').style.display = 'none';
      renderEnemyGrid(); renderFavoritesList();
      if(state.myPick) renderTargetAnalysis(); else updateRecommendations();
    }

    function setMode(mode) {
      state.mode = mode;
      document.getElementById('mode-casual').className = mode === 'casual' ? 'flex-1 py-1 text-sm font-bold rounded-md bg-yellow-500 text-slate-900 shadow' : 'flex-1 py-1 text-sm font-bold rounded-md text-gray-400';
      document.getElementById('mode-ranked').className = mode === 'ranked' ? 'flex-1 py-1 text-sm font-bold rounded-md bg-yellow-500 text-slate-900 shadow' : 'flex-1 py-1 text-sm font-bold rounded-md text-gray-400';
      document.getElementById('draft-area').style.display = mode === 'casual' ? 'none' : 'block';
      if(!state.myPick) updateRecommendations();
    }

    function setTurn(turn) {
      state.turn = turn;
      ['first', 'mid', 'last'].forEach(t => document.getElementById(`btn-${t}`).style.opacity = '0.5');
      document.getElementById(`btn-${turn}`).style.opacity = '1';
      const eSec = document.getElementById('enemy-section');
      if (turn === 'first') { eSec.style.opacity = '0.5'; eSec.style.pointerEvents = 'none'; } 
      else { eSec.style.opacity = '1'; eSec.style.pointerEvents = 'auto'; }
      if(!state.myPick) updateRecommendations();
    }

    function renderEnemyGrid(filter = '') {
      const grid = document.getElementById('enemy-grid'); grid.innerHTML = '';
      let filtered = state.allBrawlers.filter(b => b.name.toLowerCase().includes(filter.toLowerCase()) && !state.enemyPicks.includes(b.name));
      filtered.sort((a, b) => {
        const wrA = state.currentWinRates[a.name] || 0, wrB = state.currentWinRates[b.name] || 0;
        return wrB !== wrA ? wrB - wrA : a.name.localeCompare(b.name);
      });
      filtered.forEach(b => {
        const wr = state.currentWinRates[b.name] ? `<div class="absolute top-0.5 right-0.5 bg-slate-900/80 text-gray-300 text-[8px] px-1 rounded pointer-events-none">${state.currentWinRates[b.name]}%</div>` : '';
        grid.innerHTML += `<div onclick="addEnemy('${b.name}')" class="relative cursor-pointer hover:scale-105 rounded overflow-hidden"><img src="${b.image}" onerror="this.src='${getFallbackAvatar(b.name)}'" class="w-full aspect-square object-cover bg-slate-900 border border-slate-600 hover:border-red-400">${wr}</div>`;
      });
    }

    function addEnemy(name) {
      if (state.enemyPicks.length >= 5) return;
      state.enemyPicks.push(name);
      document.getElementById('enemy-search').value = '';
      renderSelectedEnemies(); renderEnemyGrid(); 
      if(state.myPick) renderTargetAnalysis(); else updateRecommendations();
    }

    function removeEnemy(name) {
      state.enemyPicks = state.enemyPicks.filter(e => e !== name);
      renderSelectedEnemies(); renderEnemyGrid(); 
      if(state.myPick) renderTargetAnalysis(); else updateRecommendations();
    }

    function renderSelectedEnemies() {
      const container = document.getElementById('selected-enemies-container'); container.innerHTML = '';
      state.enemyPicks.forEach(name => {
        const bInfo = state.allBrawlers.find(b => b.name === name);
        if (bInfo) {
          container.innerHTML += `<div class="flex items-center gap-1 bg-red-950/60 p-1 pr-2 rounded border border-red-900"><img src="${bInfo.image}" onerror="this.src='${getFallbackAvatar(name)}'" class="w-6 h-6 rounded bg-slate-900"><span class="text-xs font-bold text-white">${name}</span><button onclick="removeEnemy('${name}')" class="ml-1 text-red-500 hover:text-red-300 font-bold ml-2">X</button></div>`;
        }
      });
    }

    function selectMyPick(name) {
      state.myPick = name;
      document.getElementById('suggestions-area').classList.add('hidden');
      document.getElementById('my-locked-pick').classList.remove('hidden');
      const bInfo = state.allBrawlers.find(b => b.name === name);
      document.getElementById('locked-name').innerText = name;
      document.getElementById('locked-img').src = bInfo.image;
      
      if(bInfo.gadget) {
        document.getElementById('locked-gadget-img').src = bInfo.gadget.imageUrl;
        document.getElementById('locked-gadget-name').innerText = bInfo.gadget.name;
      }
      if(bInfo.starPower) {
        document.getElementById('locked-sp-img').src = bInfo.starPower.imageUrl;
        document.getElementById('locked-sp-name').innerText = bInfo.starPower.name;
      }
      renderTargetAnalysis();
    }

    function unlockPick() {
      state.myPick = null;
      document.getElementById('my-locked-pick').classList.add('hidden');
      document.getElementById('suggestions-area').classList.remove('hidden');
      updateRecommendations();
    }

    function renderTargetAnalysis() {
      if(!state.myPick) return;
      const tContainer = document.getElementById('locked-targets'); tContainer.innerHTML = '';
      if(state.enemyPicks.length === 0) {
        tContainer.innerHTML = '<p class="text-[10px] text-gray-400 mt-2">Adicione inimigos no passo 3 para ver em quem focar.</p>'; return;
      }
      const myInfo = state.allBrawlers.find(b => b.name === state.myPick);
      state.enemyPicks.forEach(enemyName => {
        const eInfo = state.allBrawlers.find(b => b.name === enemyName);
        let statusHtml = '';
        if (classAdvantages[myInfo.className] && classAdvantages[myInfo.className].includes(eInfo.className)) {
          statusHtml = `<span class="bg-green-900 text-green-300 text-[10px] px-2 py-0.5 rounded border border-green-700 font-bold ml-auto">🎯 Alvo Ideal</span>`;
        } else if (classAdvantages[eInfo.className] && classAdvantages[eInfo.className].includes(myInfo.className)) {
          statusHtml = `<span class="bg-red-900 text-red-300 text-[10px] px-2 py-0.5 rounded border border-red-700 font-bold ml-auto">⚠️ Evite</span>`;
        } else {
          statusHtml = `<span class="text-gray-500 text-[10px] font-bold ml-auto">Neutro</span>`;
        }
        tContainer.innerHTML += `<div class="flex items-center gap-2 bg-slate-800 p-1.5 rounded border border-slate-600"><img src="${eInfo.image}" class="w-6 h-6 rounded bg-slate-900"><span class="text-xs text-white">${eInfo.name}</span><span class="text-[9px] text-gray-400">(${eInfo.className})</span>${statusHtml}</div>`;
      });
    }

    function updateRecommendations() {
      const resDiv = document.getElementById('results'); resDiv.innerHTML = '';
      if (!state.mapId) { resDiv.innerHTML = '<p class="text-xs text-gray-400">Selecione o mapa acima.</p>'; return; }
      if (state.mode === 'ranked' && !state.turn) { resDiv.innerHTML = '<p class="text-xs text-gray-400">Selecione o seu turno.</p>'; return; }

      const selectedMap = state.allMapsList.find(m => m.id == state.mapId);
      const normalizedMapName = selectedMap ? normalizeStr(selectedMap.name) : "";
      const dna = mapDNA[normalizedMapName]; 

      let candidatos = state.mapTopBrawlers.map(apiB => {
        let bInfo = state.allBrawlers.find(b => b.name === apiB.brawler.name);
        let scoreFinal = apiB.winRate; 
        let tagsAtivas = [];

        if (state.isOfflineFallback && dna && bInfo) {
          if (dna.boost.includes(bInfo.className)) { scoreFinal += 20; tagsAtivas.push('👍 Terreno'); }
          if (dna.specificBoost && dna.specificBoost.includes(bInfo.name)) { scoreFinal += 30; tagsAtivas.push('👑 Meta'); }
          if (dna.punish.includes(bInfo.className)) { scoreFinal -= 40; tagsAtivas.push('❌ Ruim'); }
        }

        return { 
          name: apiB.brawler.name, image: bInfo ? bInfo.image : '', className: bInfo ? bInfo.className : '', 
          isFav: state.favorites.includes(apiB.brawler.name), score: scoreFinal, baseWr: apiB.winRate, tags: tagsAtivas
        };
      });

      if (state.mode === 'ranked') {
        candidatos = candidatos.filter(b => !state.enemyPicks.includes(b.name));
        if (state.turn === 'mid' || state.turn === 'last') {
          candidatos.forEach(c => {
            state.enemyPicks.forEach(enemyName => {
              const enemyClass = state.allBrawlers.find(e => e.name === enemyName)?.className;
              if (classAdvantages[c.className] && classAdvantages[c.className].includes(enemyClass)) {
                c.score += state.isOfflineFallback ? 15 : 2; 
                if (state.isOfflineFallback && !c.tags.includes('🎯 Countera')) c.tags.push('🎯 Countera');
              }
              if (classAdvantages[enemyClass] && classAdvantages[enemyClass].includes(c.className)) {
                c.score -= state.isOfflineFallback ? 20 : 5; 
                if (state.isOfflineFallback && !c.tags.includes('⚠️ Apanha')) c.tags.push('⚠️ Apanha');
              }
            });
          });
        }
      }

      candidatos.sort((a, b) => (b.isFav === a.isFav) ? (b.score - a.score) : (b.isFav ? 1 : -1));
      const best = candidatos.slice(0, 5);
      
      best.forEach(b => {
        const starHtml = b.isFav ? `<div class="absolute -top-2 -left-2 text-xl drop-shadow-md z-20">⭐</div>` : '';
        const scoreVisor = state.isOfflineFallback 
          ? `<span class="text-[10px] bg-purple-900/80 text-purple-200 px-1.5 py-0.5 rounded border border-purple-700/50 font-bold whitespace-nowrap">Nota: ${b.score}</span>`
          : `<span class="text-[10px] bg-green-900/80 text-green-200 px-1.5 py-0.5 rounded border border-green-700/50 font-bold whitespace-nowrap">WR: ${b.baseWr}%</span>`;

        let htmlTags = '';
        if (state.isOfflineFallback && b.tags.length > 0) {
           htmlTags = `<div class="flex gap-1 mt-1">` + b.tags.map(t => `<span class="text-[8px] bg-slate-800 text-gray-400 px-1 rounded border border-slate-700">${t}</span>`).join('') + `</div>`;
        }

        resDiv.innerHTML += `
          <div onclick="selectMyPick('${b.name}')" class="cursor-pointer glass p-2 rounded-lg border-l-4 ${b.isFav ? 'border-yellow-400 bg-yellow-900/10' : 'border-green-500'} flex items-center gap-3 hover:bg-slate-700 transition relative">
            ${starHtml}
            <img src="${b.image}" onerror="this.src='${getFallbackAvatar(b.name)}'" class="w-10 h-10 rounded border border-slate-600 bg-slate-900 shadow-lg">
            <div class="flex-1">
              <span class="font-bold text-base text-white block">${b.name}</span>
              <span class="text-[9px] text-gray-400">${b.className}</span>
              ${htmlTags}
            </div>
            ${scoreVisor}
          </div>
        `;
      });
    }

    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('translate-x-full'); document.getElementById('sidebar-overlay').classList.toggle('hidden'); }
    function renderFavoritesList(filter = '') {
      const list = document.getElementById('favorites-list'); list.innerHTML = '';
      let filtered = state.allBrawlers.filter(b => b.name.toLowerCase().includes(filter.toLowerCase()));
      filtered.sort((a, b) => {
        const aFav = state.favorites.includes(a.name), bFav = state.favorites.includes(b.name);
        if (aFav && !bFav) return -1; if (!aFav && bFav) return 1;
        const wrA = state.currentWinRates[a.name] || 0, wrB = state.currentWinRates[b.name] || 0;
        return wrB !== wrA ? wrB - wrA : a.name.localeCompare(b.name);
      });
      filtered.forEach(b => {
        const isFav = state.favorites.includes(b.name);
        const style = isFav ? 'border-2 border-yellow-400 opacity-100' : 'border border-slate-700 opacity-50 hover:opacity-100';
        const wr = state.currentWinRates[b.name] ? `<span class="absolute top-0 right-0 bg-slate-900/80 text-gray-300 text-[8px] px-1 rounded-bl-lg">${state.currentWinRates[b.name]}%</span>` : '';
        list.innerHTML += `<div onclick="toggleFav('${b.name}')" class="cursor-pointer flex flex-col items-center gap-1 relative"><img src="${b.image}" class="w-full aspect-square object-cover rounded-lg bg-slate-800 ${style}"><span class="text-[9px] truncate w-full text-center ${isFav ? 'text-yellow-400 font-bold' : 'text-gray-400'}">${b.name}</span>${wr}</div>`;
      });
    }
    function toggleFav(brawlerName) {
      if (state.favorites.includes(brawlerName)) state.favorites = state.favorites.filter(f => f !== brawlerName);
      else state.favorites.push(brawlerName);
      localStorage.setItem('brawlFavorites', JSON.stringify(state.favorites));
      renderFavoritesList(document.getElementById('fav-search').value);
      if(!state.myPick) updateRecommendations();
    }

    // Inicializa o diagnóstico automaticamente
    runFullDiagnostics();
  </script>
</body>
